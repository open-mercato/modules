# Receipts from a finished nightly run (spec 5.1, 5.3 "Job collect"). Trusted job, no foreign code: step status from
# the Actions API only, artifacts only for log excerpts, applied patches, notes and the scaffold metadata.
# Unconfirmed red cells are dispatched again (nightly.yml, attempt 2) and collected in this same job by polling; a second
# collect started by that retry run finds the night in the receipts and ends without changes.
# The write goes through lib/sources/data-branch.ts (fetch, reset, replay `collect --bundle`, commit, push; 3 attempts).
name: collect

on:
  workflow_run:
    workflows: [nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a nightly run to collect (replay of a night)."
        type: string
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  collect:
    name: collect
    # Only runs of nightly on main from this repository, started by the schedule or a dispatch (checked again in code).
    # A night nightly.yml skipped (scheduled while the repository is private) has nothing to collect.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion != 'skipped' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Data checkout
        run: |
          set -euo pipefail
          if git fetch origin data; then git worktree add --detach .data FETCH_HEAD; else git worktree add --detach .data HEAD; fi

      - name: Gather the night
        # Reads the run, its jobs and artifacts; dispatches and waits for the retry when needed (up to 40 min).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "bad run id: $RUN_ID"; exit 1; }
          yarn om collect --run "$RUN_ID" --wait-retry --no-apply

      - name: Write receipts to data
        if: ${{ hashFiles('out/night.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${GIT_CONFIG_VALUE_0#AUTHORIZATION: basic }"
          export GIT_CONFIG_VALUE_0
          node lib/sources/data-branch.ts --dir .data --message "chore(data): receipts $RUN_ID" -- \
            bash -euo pipefail -c '
              yarn om collect --bundle out/night.json
              if [ -f .data/lines.json ]; then
                yarn om radar || echo "radar skipped (no fit for the next line yet)"
                yarn om health --changed
              fi
            '

      - name: Upload the night bundle
        if: ${{ always() && hashFiles('out/night.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: night-${{ env.RUN_ID }}
          path: |
            out/night.json
            out/retry.json
          retention-days: 30
