# Formatting only (spec 5.1, 5.5): `yarn om format modules` (key order and Prettier, category aliases to their ID),
# then the autofix.ci app commits the diff to the pull request, forks included. The workflow name must be
# `autofix.ci`. No write permission here: the app holds it, and the format step never changes a value.
name: autofix.ci

on:
  pull_request:
    paths:
      - "modules/**"

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Format descriptors
        run: yarn om format modules

      - name: Send fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: format descriptors"
