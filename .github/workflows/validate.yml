# Pull request check (spec 5.1, 5.2). Three jobs, so the descriptor summary of `validate` appears as soon as that job
# ends (GitHub shows a step summary when its job finishes; with check, test and the builds in the same job it took
# minutes longer, finding of 25 Oct). Read-only token, no secrets, no privileged trigger. Branch protection should
# require the `validate` job (spec 5.6 item 4, an owner click, not set yet; docs/RUNBOOK.md "Repository setup").
# A pull request that changes only modules/ skips `yarn test` in `checks`: its invariants over the live modules/
# (test/validate/run.test.ts, seed.test.ts) only repeat what `validate` reports, one problem as two red checks
# (finding of 25 Oct). `yarn check` still runs there (Prettier is what the format warning of validate points to), and
# any change outside modules/ runs the whole suite, so a policy change that breaks a descriptor is still caught.
name: validate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # the current labels of the PR (name-reviewed), read when the step runs
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Read data branch
        # Read only: lines and built-in modules for Fit and collision checks. Missing on the first day. The checkout
        # above (fetch-depth: 0) has every branch already. A second `ls-remote` or fetch has no credentials, so in a
        # private repository it failed and the step said "No data branch yet" next to an existing branch, and Fit was
        # skipped on every pull request (finding of 25 Oct).
        run: |
          if git rev-parse --verify -q refs/remotes/origin/data >/dev/null; then
            git worktree add --detach .data origin/data
            echo "Data branch at $(git rev-parse --short refs/remotes/origin/data)."
          else
            mkdir -p .data
            echo "No data branch in the checkout (refs/remotes/origin/data): Fit is skipped, built-in modules come from the pinned CLI."
          fi

      - name: Validate descriptors
        # The labels as they are when the step runs, not those of the event: a re-run after a curator adds
        # `name-reviewed` reuses the payload of the original event, which does not have the label, so the
        # typosquat error stayed (finding of 25 Oct). The event labels are the fallback.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if labels="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '[.[].name] | join(",")')"; then
            export PR_LABELS="$labels"
          else
            export PR_LABELS="$EVENT_LABELS"
            echo "The labels API did not answer: labels of the pull request event."
          fi
          echo "Labels: ${PR_LABELS:-none}"
          yarn om validate --changed=origin/main --summary "$GITHUB_STEP_SUMMARY"

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if [ -n "$changed" ] && ! grep -qv '^modules/' <<<"$changed"; then
            echo "descriptors_only=true" >>"$GITHUB_OUTPUT"
            echo "Only modules/ changed: validate reports the descriptors, the test suite is skipped."
          else
            echo "descriptors_only=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Check
        if: ${{ !cancelled() }}
        run: yarn check

      - name: Test
        if: ${{ !cancelled() && steps.scope.outputs.descriptors_only != 'true' }}
        run: yarn test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # day 0 (review r2): the state before the first night has no receipts at all; it once broke the build, so the
      # site is built on it in every run, not only when site/ changes
      - name: Build site on day-0 data
        if: ${{ !cancelled() }}
        run: |
          day0="$RUNNER_TEMP/day0"
          rm -rf "$day0"
          mkdir -p "$day0"
          cp -R test/fixtures/data/. "$day0"
          rm -rf "$day0/receipts"
          yarn om emit --data "$day0"
          yarn astro build

      - name: Detect site changes
        id: site
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet origin/main...HEAD -- site lib/emit astro.config.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site on fixture data
        if: ${{ !cancelled() && steps.site.outputs.changed == 'true' }}
        run: |
          yarn om emit --data test/fixtures/data
          yarn astro build
