# Site on Cloudflare Pages (spec 5.1, 5.2; Cloudflare instead of GitHub Pages, Piotr and owner decision A(a), 28 Oct):
# `yarn build` (emit + astro) from main and the data branch, then `wrangler pages deploy` (direct upload) to the
# project CF_PAGES_PROJECT, served at modules.openmercato.com. Runs after watch, sync and collect finish on main
# (pushes with GITHUB_TOKEN do not start workflows), on push to main, daily and by hand. With no data branch yet the
# build runs on empty data and shows the empty states.
# templates.openmercato.com (decision B of 29 Oct) is a second custom domain of the same project: functions/_middleware.ts
# redirects its root to modules.openmercato.com/templates, and dist/_routes.json (from site/public) runs Functions on `/` only. The deploy step
# runs from the repository root, where `wrangler pages deploy` finds and bundles functions/ by itself.
# Move under www.openmercato.com/run, the Run section of the main site (decisions of 13 and 14 Nov): with the
# repository variables SITE_URL, BASE_PATH and HOME_PATH set (https://www.openmercato.com, /run and /modules) the build
# puts the site in dist/<base>/, the home page at <base><home> (/run/modules, with dist/_redirects sending /run and
# /run/ there), and keeps 404.html, _routes.json, _redirects, schema/, templates.json, picker.json and modules.json at
# the root of dist; `yarn om pages-site` writes functions/site.ts from the same variables in both jobs, so on the
# production hosts the Functions redirect every other page to the site and serve every other machine-readable file
# (llms.txt, m/<package>.md, badges, data files) from dist/<base>/ with a 200. A `*.pages.dev` deployment address serves
# the site under <base>/ without redirects, and the summary and the environment link to its home page. Without the
# variables nothing changes. See docs/RUNBOOK.md, Move under www.openmercato.com/run.
# Two jobs (review of 28 Oct): `build` has no environment, so a run that does not deploy records no deployment.
# `deploy` alone uses environment `cloudflare` and runs only when the repository variable CLOUDFLARE_ACCOUNT_ID is
# set (the account ID is not a secret; mcp-deploy.yml reads the same variable). Without it the build and its checks
# still run, then the run ends green with a warning and a summary that say the site was not deployed.
# Two more jobs, `preview-build` and `preview` (15 Nov), deploy the nested layout with fixed values to the branch
# alias run-preview of the same project while BASE_PATH is `/` (production at the root, as until 26 Nov 2026); since
# BASE_PATH is /run they are skipped. See the comment above them.
# The main site (www site migration spec 2026-11-24-www-site-migration.md of PR #23, Phase 1a): `yarn build` writes
# the catalog to dist-run/ and the main site (www/) to dist-www/. Without PAGES_MERGED the upload is the catalog alone,
# dist-run/ moved to dist/ as it is; with the repository variable PAGES_MERGED=1 `yarn om pages-site --merge` composes
# dist/ from both (the main site at the root, the catalog under /run) and the checks follow the merged layout. Two
# jobs, `www-preview-build` and `www-preview`, deploy the merged layout to the branch alias www-preview with
# PAGES_NOINDEX=1.
# Production since 26 Nov 2026 (owner's decision, docs/RUNBOOK.md, Main site on modules.openmercato.com): PAGES_MERGED=1,
# SITE_URL, BASE_PATH and HOME_PATH for www and /run, and the repository variable PAGES_SERVE_ORIGIN
# (https://modules.openmercato.com), so production deploys the merged layout and the Pages hosts serve it themselves: not
# indexed (dist/_headers and a robots.txt that allows nothing) and without Google Analytics, canonical addresses on
# SITE_URL, old catalog page addresses a 301 under /run on the same host. The preview jobs never read it. At the www
# switch (RUNBOOK, Main site switch, C8) only PAGES_SERVE_ORIGIN is deleted. `Check layout variables` stops a run whose
# variables make no layout before the build, and `Smoke test the merged upload` runs a merged upload in the Pages
# emulator (scripts/pages-smoke.sh).
# The main site's content (Strapi CMS spec 2026-11-27-www-strapi-cms.md, Phase 4): `Choose www content` decides from the
# repository variable WWW_CONTENT_SOURCE and the inputs alone, with no secret (lib/www-cms/source.ts). Unset or `files`
# (the default): the build reads www/content of the commit and nothing else runs. `shadow`: `Read www content` pulls
# Strapi into a temporary directory and names the files that differ; the build still reads the files. `strapi`: the
# pull replaces www/content and the media, and when Strapi is down or its content invalid a build not started by a
# publish falls back to the branch www-content (a publish build fails). STRAPI_URL and STRAPI_READ_TOKEN are read in
# `Read www content` only. After a good deploy of pulled content, the job `www-snapshot` writes it to www-content
# (`contents: write` on that job only). `www_content: snapshot` with a `snapshot` commit builds that commit of
# www-content and never reads Strapi (rollback). A failed publish build or a snapshot fallback creates or updates one
# issue (job `www-issue`, `issues: write` on that job only), and the next good Strapi build closes it. A run on another
# ref than main builds that ref and deploys nothing.
name: pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "cms/**"
  workflow_run:
    workflows:
      - watch
      - sync
      - collect
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      www_content:
        description: "Main site content: auto (by WWW_CONTENT_SOURCE), publish (sent by the Strapi hook) or snapshot (a commit of www-content)"
        type: choice
        options:
          - auto
          - publish
          - snapshot
        default: auto
      snapshot:
        description: "With www_content snapshot: the commit of www-content to build (rollback); Strapi is not read"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://modules.openmercato.com' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/' }}
  # the home page under the base: / (the base itself), or /modules for https://www.openmercato.com/run/modules
  HOME_PATH: ${{ vars.HOME_PATH || '/' }}
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'open-mercato-modules' }}
  # 1: production deploys the merged layout (the main site at the root, the catalog under BASE_PATH); off by default
  PAGES_MERGED: ${{ vars.PAGES_MERGED || '' }}
  # the origin that serves the merged layout before the www switch (https://modules.openmercato.com); off by default
  PAGES_SERVE_ORIGIN: ${{ vars.PAGES_SERVE_ORIGIN || '' }}

jobs:
  build:
    name: build
    # Off while the repository is private (nothing to publish yet); it starts once the repository is public.
    if: ${{ !github.event.repository.private && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.settings.outputs.deploy }}
      commit: ${{ steps.checkout.outputs.commit }}
      www-snapshot: ${{ steps.read.outputs.snapshot }}
      www-newest: ${{ steps.read.outputs.newest }}
      www-issue: ${{ steps.read.outputs.issue }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      MCP_URL: ${{ vars.MCP_URL }}
      WEBMCP_OT_TOKENS: ${{ vars.WEBMCP_OT_TOKENS }}
    steps:
      - name: Check deploy settings
        id: settings
        # A job without an environment does not see the secrets of environment `cloudflare`, and a job-level `if`
        # cannot read secrets at all. The repository variable is visible here, so it is the switch for `deploy`. Only
        # a run on main deploys (environment `cloudflare` accepts main only too): a run on another ref builds and checks.
        env:
          HAS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$HAS_ACCOUNT_ID" = "true" ] && [ "$ON_MAIN" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        id: checkout
        # main as it is now (a pending run builds the newest commit); a run on another ref builds the commit it was
        # started on and deploys nothing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Check layout variables
        # seconds, before the build: a set of SITE_URL, BASE_PATH, HOME_PATH, PAGES_MERGED and PAGES_SERVE_ORIGIN that
        # makes no layout (a partial rollback) stops here with the reason and what goes together
        run: yarn om pages-site --settings

      - name: Read data branch
        # Empty data only when the branch does not exist. A fetch that fails for any other reason (network,
        # credentials) stops the deploy instead of publishing an empty catalog over the live one.
        run: |
          err="$(mktemp)"
          if git fetch --no-tags --depth=1 origin +refs/heads/data:refs/remotes/origin/data 2>"$err"; then
            git worktree add --detach .data origin/data
          elif grep -q "couldn't find remote ref" "$err"; then
            mkdir -p .data
            echo "No data branch yet: building on empty data." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat "$err"
            echo "::error::Cannot read the data branch; not deploying."
            exit 1
          fi

      - name: Choose www content
        id: www
        # lib/www-cms/source.ts from WWW_CONTENT_SOURCE and the inputs alone, with no secret. Unset or files: pull=none
        # and use=files, the next two steps are skipped and the build reads www/content of the commit.
        env:
          WWW_CONTENT_SOURCE: ${{ vars.WWW_CONTENT_SOURCE }}
          WWW_CONTENT_INPUT: ${{ inputs.www_content }}
          WWW_SNAPSHOT_INPUT: ${{ inputs.snapshot }}
        run: yarn om www-content plan

      - name: Read www content
        id: read
        # shadow (compare) or strapi (replace) only: the one step with STRAPI_URL and STRAPI_READ_TOKEN. The last good
        # snapshot (the tip of www-content, when the branch exists) is the pull's baseline for removed URLs and media,
        # and the fallback; lib/www-cms/source.ts decides, a failure stops the build here.
        if: ${{ steps.www.outputs.pull == 'compare' || steps.www.outputs.pull == 'replace' }}
        env:
          WWW_CONTENT_SOURCE: ${{ vars.WWW_CONTENT_SOURCE }}
          WWW_CONTENT_INPUT: ${{ inputs.www_content }}
          WWW_SNAPSHOT_INPUT: ${{ inputs.snapshot }}
          STRAPI_URL: ${{ vars.STRAPI_URL }}
          STRAPI_READ_TOKEN: ${{ secrets.STRAPI_READ_TOKEN }}
        run: |
          snap=()
          err="$(mktemp)"
          if git fetch --no-tags --depth=1 origin +refs/heads/www-content:refs/remotes/origin/www-content 2>"$err"; then
            git worktree add --detach "$RUNNER_TEMP/www-snapshot" origin/www-content
            snap=(--snapshot-dir "$RUNNER_TEMP/www-snapshot" --snapshot-sha "$(git rev-parse --short=12 origin/www-content)" --snapshot-date "$(git log -1 --format=%cs origin/www-content)")
          elif ! grep -q "couldn't find remote ref" "$err"; then
            cat "$err"
            echo "::error::Cannot read the www-content branch."
            exit 1
          fi
          yarn om www-content read --work "$RUNNER_TEMP/www" "${snap[@]}"

      - name: Upload www issue text
        # the text of the issue of A9 for the job www-issue (lib/www-cms/issue.ts), also when Read www content stopped
        # the build; from main only, as the issue
        if: ${{ always() && github.ref == 'refs/heads/main' && (steps.read.outputs.issue == 'update' || steps.read.outputs.issue == 'close') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www-issue
          path: ${{ runner.temp }}/www/issue
          if-no-files-found: error
          retention-days: 1

      - name: Use www snapshot
        # a commit of www-content laid over www/ (lib/www-cms/snapshot.ts): the fallback of Read www content (the tip it
        # checked out), or a commit by hand with www_content snapshot. On main a commit by hand must be one of
        # www-content; on another ref, which deploys nothing, the tip of a branch of this repository is accepted too. A
        # commit of a fork can be fetched by its SHA and is never accepted.
        if: ${{ steps.www.outputs.use == 'snapshot' || steps.read.outputs.use == 'snapshot' }}
        env:
          BY_HAND: ${{ steps.www.outputs.use == 'snapshot' }}
          COMMIT: ${{ steps.www.outputs.commit }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$BY_HAND" != "true" ]; then
            yarn om www-content apply --from "$RUNNER_TEMP/www-snapshot"
            exit 0
          fi
          full=""
          if git fetch --no-tags origin +refs/heads/www-content:refs/remotes/origin/www-content 2>/dev/null; then
            c="$(git rev-parse --verify --quiet "$COMMIT^{commit}" || true)"
            if [ -n "$c" ] && git merge-base --is-ancestor "$c" origin/www-content; then full="$c"; fi
          fi
          if [ -z "$full" ] && [ "$ON_MAIN" != "true" ]; then
            full="$(git ls-remote --heads origin | awk -v c="$COMMIT" 'index($1, c) == 1 { print $1; exit }')"
            if [ -n "$full" ]; then git fetch --no-tags --depth=1 origin "$full"; fi
          fi
          if [ -z "$full" ]; then
            echo "::error title=www content::$COMMIT is not a commit of the www-content branch."
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/www-snapshot-by-hand" "$full"
          yarn om www-content apply --from "$RUNNER_TEMP/www-snapshot-by-hand"
          echo "Snapshot commit: $full" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        # the catalog to dist-run/, and with PAGES_MERGED the main site to dist-www/ too
        run: |
          if [ "$PAGES_MERGED" = "1" ]; then yarn build; else yarn build:run; fi

      - name: Lay out the upload
        # catalog only (the default): dist-run/ is the upload as it is. Merged: both builds composed into dist/.
        run: |
          rm -rf dist
          if [ "$PAGES_MERGED" = "1" ]; then yarn om pages-site --merge; else mv dist-run dist; fi

      - name: Write Functions config
        # functions/site.ts tells the Functions where the site is (lib/core/site-host.ts), from SITE_URL, BASE_PATH,
        # HOME_PATH and PAGES_MERGED.
        run: yarn om pages-site

      - name: Check artifact contents
        run: |
          # The site sits at the root of dist, or in dist/<base>/ when BASE_PATH is not / (lib/emit/pages-layout.ts).
          # The home page is index.html there, or <home>.html when HOME_PATH is not / (/modules: modules.html); the
          # layout check at the end of this step looks for it.
          base="$(printf '%s' "${BASE_PATH:-/}" | sed -E 's#^/+##; s#/+$##')"
          site="dist${base:+/$base}"
          # wrangler 4.149.0 pages deploy uploads dotfiles (its walk skips only .DS_Store, .git, .wrangler, node_modules and the
          # _headers/_redirects/_routes.json/_worker.js/functions config names), so .well-known/ goes up as built.
          # The MCP server card is there only with MCP_URL (no card for a Worker that is not deployed, finding of 25 Oct).
          test -f "$site/.well-known/agent-skills/index.json" || { echo "$site/.well-known/agent-skills/index.json is missing"; exit 1; }
          if [ -n "${MCP_URL:-}" ]; then
            test -f "$site/.well-known/mcp/server-card.json" || { echo "$site/.well-known/mcp/server-card.json is missing"; exit 1; }
          fi
          test -f "$site/modules.json" || { echo "$site/modules.json is missing"; exit 1; }
          # Cloudflare Pages serves 404.html for missing paths; without it every missing path answers 200 with index.html
          test -f dist/404.html || { echo "dist/404.html is missing"; exit 1; }
          # the Functions route list: without it every request would run functions/_middleware.ts
          test -f dist/_routes.json || { echo "dist/_routes.json is missing"; exit 1; }
          test -f "$site/templates.html" || { echo "$site/templates.html is missing"; exit 1; }
          # the layout as a whole for SITE_URL, BASE_PATH and HOME_PATH: root files, routes and redirects, the home
          # page, the fixed schema $id, every link of every page under the base, and functions/site.ts
          yarn om pages-site --check dist

      - name: Check Pages limits
        # The walk wrangler runs before an upload (20,000 files, 25 MiB per file), offline and without the token, so a
        # run that does not deploy still proves the build would deploy.
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          yarn wrangler pages project validate dist
          echo "dist: $(find dist -type f | wc -l | tr -d ' ') files"

      - name: Check Pages Functions
        # The bundle `pages deploy` makes of functions/ (the templates host redirect), offline and without the token.
        env:
          WRANGLER_SEND_METRICS: "false"
        run: yarn wrangler pages functions build functions --outdir "$RUNNER_TEMP/functions"

      - name: Smoke test the merged upload
        # The upload in the Pages emulator of the locked wrangler, with its Functions, _redirects, _headers and
        # _routes.json (scripts/pages-smoke.sh, about 30 s): every redirect rule read, the security and cache headers,
        # and with PAGES_SERVE_ORIGIN the old catalog addresses in one hop. Merged layout only.
        if: ${{ env.PAGES_MERGED == '1' }}
        timeout-minutes: 4
        run: scripts/pages-smoke.sh dist

      - name: Upload site
        # Only for a deploy (artifact storage counts against the account quota), kept one day. upload-artifact skips
        # dotfiles unless told otherwise, and .well-known/ must reach the deploy job.
        if: ${{ steps.settings.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload www snapshot
        # the pulled content for the job www-snapshot, only when this run deploys it
        if: ${{ steps.read.outputs.snapshot == 'true' && steps.settings.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www-content
          path: ${{ runner.temp }}/www/snapshot
          if-no-files-found: error
          retention-days: 1

      - name: Not deployed
        if: ${{ steps.settings.outputs.deploy != 'true' }}
        env:
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$ON_MAIN" != "true" ]; then
            echo "::notice title=pages not deployed::A run on $GITHUB_REF builds and checks the site; only a run on main deploys."
            echo "**Not deployed.** A run on \`$GITHUB_REF\` builds and checks the site; only a run on main deploys." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=pages not deployed::No repository variable CLOUDFLARE_ACCOUNT_ID; the site was built and checked but not deployed."
          {
            echo "**Not deployed.** No repository variable CLOUDFLARE_ACCOUNT_ID: the site was built and checked, nothing was uploaded."
            echo ""
            echo "To deploy, create the Cloudflare Pages project \`$CF_PAGES_PROJECT\` (direct upload, production branch main) with"
            echo "the custom domain modules.openmercato.com, add the secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)"
            echo "in Settings > Environments > cloudflare, then the repository variable CLOUDFLARE_ACCOUNT_ID in Settings > Secrets"
            echo "and variables > Actions > Variables. See docs/RUNBOOK.md, Repository setup."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: build
    if: ${{ needs.build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare
      # the deployment address, under the base path when there is one (set by the Summary step)
      url: ${{ steps.summary.outputs.url }}
    steps:
      - name: Check token
        # The token stays an environment secret, so the main-only rule of `cloudflare` guards it; only this job sees
        # it. The variable that started this job without the token is a half setup: fail red, do not pass quietly.
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=pages not deployed::CLOUDFLARE_ACCOUNT_ID is set but environment cloudflare has no CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Checkout
        # The commit the build job built, for the locked wrangler and the commit the deployment names.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        # wrangler-action finds wrangler 4.149.0 here from the lockfile and installs nothing of its own.
        run: yarn install --immutable

      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Write Functions config
        # The same functions/site.ts the build job checked: this checkout has the committed default.
        run: yarn om pages-site

      - name: Check downloaded site
        # The artifact keeps dotfiles only with include-hidden-files; this proves .well-known/ made the trip, and the
        # layout check proves the site and functions/site.ts were made for the same SITE_URL, BASE_PATH and HOME_PATH.
        run: |
          base="$(printf '%s' "${BASE_PATH:-/}" | sed -E 's#^/+##; s#/+$##')"
          site="dist${base:+/$base}"
          test -f "$site/.well-known/agent-skills/index.json" || { echo "$site/.well-known/agent-skills/index.json is missing"; exit 1; }
          test -f dist/404.html || { echo "dist/404.html is missing"; exit 1; }
          test -f dist/_routes.json || { echo "dist/_routes.json is missing"; exit 1; }
          yarn om pages-site --check dist

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          packageManager: yarn
          # --branch main is the production branch of the project; --commit-dirty silences the wrangler warning about local
          # changes (dist/ and the yarn state are ignored, so the checkout is clean). functions/ of the checkout goes up
          # with the site: the action runs in the repository root.
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Summary
        id: summary
        # Under a base path the deployment address (<hash>.<project>.pages.dev) serves the site at <base>/ and is not
        # redirected to production (hostRedirect), so the link goes to its home page there (<base>/, or <base><home>
        # with HOME_PATH): the new version can be looked at first.
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          base="$(printf '%s' "${BASE_PATH:-/}" | sed -E 's#^/+##; s#/+$##')"
          home="$(printf '%s' "${HOME_PATH:-/}" | sed -E 's#^/+##; s#/+$##')"
          # path of the home page on any host: /, /<base>/ or /<base>/<home>
          path="/${base:+$base/}$home"
          url="$DEPLOYMENT_URL"
          if [ -n "$url" ] && [ -n "$base" ]; then url="${url%/}$path"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            if [ -n "$PAGES_SERVE_ORIGIN" ]; then
              # the merged layout served on a Pages host: the main site at its root, canonical addresses on SITE_URL
              echo "Site deployed to Cloudflare Pages project \`$CF_PAGES_PROJECT\`: ${PAGES_SERVE_ORIGIN%/}/ (the catalog at ${PAGES_SERVE_ORIGIN%/}$path, canonical on ${SITE_URL%/}, noindex)"
            else
              echo "Site deployed to Cloudflare Pages project \`$CF_PAGES_PROJECT\`: ${SITE_URL%/}$path"
            fi
            echo ""
            echo "This deployment: ${url:-see the wrangler output}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Write www snapshot (Strapi CMS spec, API Contracts): after a good deploy of content pulled fresh from Strapi (strapi
  # mode, and shadow mode so that the first strapi build already has a fallback), the pulled tree becomes one commit
  # `www-content: <newest updatedAt>` of the branch www-content, the pinned snapshot and the fallback
  # (lib/www-cms/snapshot.ts). Pushed with GITHUB_TOKEN, so it starts no workflow; skipped when nothing but the pull
  # time changed. It never runs while WWW_CONTENT_SOURCE is unset or files: the build then reads no Strapi.
  www-snapshot:
    name: write www snapshot
    needs:
      - build
      - deploy
    if: ${{ needs.build.outputs.www-snapshot == 'true' && needs.deploy.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download pulled content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www-content
          path: snapshot

      - name: Write www snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ needs.build.outputs.www-newest }}
        run: |
          git init -q branch
          cd branch
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          # the token as actions/checkout passes it, a header for github.com, never in a URL or a log
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --no-tags --depth=1 origin +refs/heads/www-content:refs/remotes/origin/www-content 2>/dev/null; then
            git checkout -q -b www-content origin/www-content
          else
            git checkout -q --orphan www-content
          fi
          git rm -rq --ignore-unmatch .
          cp -R ../snapshot/. .
          git add -A
          # the pull time alone is no change
          if git rev-parse --verify -q HEAD >/dev/null && [ -z "$(git diff --cached --name-only -- . ':!manifest.json')" ] &&
            [ "$(git show HEAD:manifest.json 2>/dev/null | jq -S 'del(.pulledAt)')" = "$(jq -S 'del(.pulledAt)' manifest.json)" ]; then
            echo "www-content unchanged: nothing written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -qm "www-content: ${NEWEST:-none}"
          git push -q origin HEAD:refs/heads/www-content
          echo "Snapshot written: www-content $(git rev-parse --short=12 HEAD), newest change ${NEWEST:-none}." >> "$GITHUB_STEP_SUMMARY"

  # The issue of A9 (Strapi CMS spec, Step 4.2): one issue of this repository under a fixed title. A build that read
  # Strapi and stopped (a publish) or fell back to the snapshot creates it, or updates its text when it is open, with the
  # problems by file and field (lib/www-cms/issue.ts); a publish build that read Strapi without a problem and then
  # failed later does the same with that cause. The next build that read Strapi without a problem and deployed closes
  # it. No assignee, no label, no mention; `issues: write` on this job only. Never runs while WWW_CONTENT_SOURCE is
  # unset, files or shadow (Read www content then sets no update or close), and only on main.
  www-issue:
    name: www issue
    needs:
      - build
      - deploy
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build.outputs.www-issue == 'update' || needs.build.outputs.www-issue == 'close') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Download issue text
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www-issue
          path: issue

      - name: Write the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Main site content from Strapi is not live
          ACTION: ${{ needs.build.outputs.www-issue }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          INPUT: ${{ inputs.www_content }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --limit 200 --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          body=""
          if [ "$ACTION" = "update" ]; then
            body=issue/issue.md
          elif [ "$BUILD" = "success" ] && { [ "$DEPLOY" = "success" ] || [ "$DEPLOY" = "skipped" ]; }; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Closed by $RUN_URL: it read Strapi without a problem and the build went through."
              echo "Issue $number closed." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          elif [ "$INPUT" = "publish" ] && { [ "$BUILD" = "failure" ] || [ "$DEPLOY" = "failure" ]; }; then
            body=issue/issue-failed.md
          else
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$body" >/dev/null
            echo "Issue $number updated." >> "$GITHUB_STEP_SUMMARY"
          else
            url="$(gh issue create --title "$TITLE" --body-file "$body")"
            echo "Issue opened: $url" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Preview of the /run layout (docs/RUNBOOK.md, Preview of the /run layout): the nested build with fixed values,
  # deployed to the branch alias run-preview of the same project, https://run-preview.<project>.pages.dev, so the
  # proxy of the main site (docs/proxy/) can be tested before the switch. Two jobs of their own, parallel to build and
  # deploy, which need nothing from them: a failed preview never fails or skips the production deploy. The same guards
  # as build and deploy (public repository, a successful workflow_run, CLOUDFLARE_ACCOUNT_ID, the token of environment
  # cloudflare). Skipped once production itself is nested (the repository variable BASE_PATH is set to another
  # value than /): production then serves the same layout. PAGES_NOINDEX=1 adds dist/_headers (X-Robots-Tag: noindex)
  # and a robots.txt that allows nothing, for this build only.
  preview-build:
    name: preview build
    if: ${{ !github.event.repository.private && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (vars.BASE_PATH == '' || vars.BASE_PATH == '/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.settings.outputs.deploy }}
      commit: ${{ steps.checkout.outputs.commit }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      MCP_URL: ${{ vars.MCP_URL }}
      WEBMCP_OT_TOKENS: ${{ vars.WEBMCP_OT_TOKENS }}
      SITE_URL: https://www.openmercato.com
      BASE_PATH: /run
      HOME_PATH: /modules
      PAGES_NOINDEX: "1"
      # the catalog alone, whatever production deploys
      PAGES_MERGED: ""
      PAGES_SERVE_ORIGIN: ""
    steps:
      - name: Check deploy settings
        id: settings
        # only a run on main deploys a preview, as the build job
        env:
          HAS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$HAS_ACCOUNT_ID" = "true" ] && [ "$ON_MAIN" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Read data branch
        run: |
          err="$(mktemp)"
          if git fetch --no-tags --depth=1 origin +refs/heads/data:refs/remotes/origin/data 2>"$err"; then
            git worktree add --detach .data origin/data
          elif grep -q "couldn't find remote ref" "$err"; then
            mkdir -p .data
            echo "No data branch yet: building on empty data." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat "$err"
            echo "::error::Cannot read the data branch; not deploying."
            exit 1
          fi

      - name: Build
        # the catalog to dist-run/, and with PAGES_MERGED the main site to dist-www/ too
        run: |
          if [ "$PAGES_MERGED" = "1" ]; then yarn build; else yarn build:run; fi

      - name: Lay out the upload
        # catalog only (the default): dist-run/ is the upload as it is. Merged: both builds composed into dist/.
        run: |
          rm -rf dist
          if [ "$PAGES_MERGED" = "1" ]; then yarn om pages-site --merge; else mv dist-run dist; fi

      - name: Write Functions config
        run: yarn om pages-site

      - name: Check preview contents
        # the nested layout as a whole (the same check as the build job) and, with PAGES_NOINDEX, dist/_headers and
        # the robots.txt of the preview
        run: |
          test -f dist/run/.well-known/agent-skills/index.json || { echo "dist/run/.well-known/agent-skills/index.json is missing"; exit 1; }
          yarn om pages-site --check dist

      - name: Check Pages limits
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          yarn wrangler pages project validate dist
          echo "dist: $(find dist -type f | wc -l | tr -d ' ') files"

      - name: Check Pages Functions
        env:
          WRANGLER_SEND_METRICS: "false"
        run: yarn wrangler pages functions build functions --outdir "$RUNNER_TEMP/functions"

      - name: Upload preview
        if: ${{ steps.settings.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  preview:
    name: preview
    needs: preview-build
    if: ${{ needs.preview-build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: ${{ steps.summary.outputs.url }}
    env:
      SITE_URL: https://www.openmercato.com
      BASE_PATH: /run
      HOME_PATH: /modules
      PAGES_NOINDEX: "1"
      PAGES_MERGED: ""
      PAGES_SERVE_ORIGIN: ""
      # the branch of the preview deployment; Cloudflare serves its latest deployment at
      # https://<branch>.<project>.pages.dev
      PREVIEW_BRANCH: run-preview
    steps:
      - name: Check token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=pages not deployed::CLOUDFLARE_ACCOUNT_ID is set but environment cloudflare has no CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preview-build.outputs.commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Download preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview
          path: dist

      - name: Write Functions config
        run: yarn om pages-site

      - name: Check downloaded preview
        run: |
          test -f dist/run/.well-known/agent-skills/index.json || { echo "dist/run/.well-known/agent-skills/index.json is missing"; exit 1; }
          test -f dist/_headers || { echo "dist/_headers is missing"; exit 1; }
          yarn om pages-site --check dist

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          packageManager: yarn
          # a branch other than main is a preview deployment of the project, never production
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ env.PREVIEW_BRANCH }} --commit-dirty=true

      - name: Preview summary
        id: summary
        # The branch alias keeps the latest preview: lowercase, every character but a-z, 0-9 and - becomes -.
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          alias="$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')"
          url="https://$alias.$CF_PAGES_PROJECT.pages.dev/run/modules"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          this="see the wrangler output"
          if [ -n "$DEPLOYMENT_URL" ]; then this="${DEPLOYMENT_URL%/}/run/modules"; fi
          {
            echo "Preview of the /run layout deployed to branch \`$PREVIEW_BRANCH\` of Cloudflare Pages project \`$CF_PAGES_PROJECT\`: $url"
            echo ""
            echo "This deployment: $this"
            echo ""
            echo "Check it, or the proxy in front of it, with docs/proxy/check.sh <base URL>."
          } >> "$GITHUB_STEP_SUMMARY"

  # Preview of the merged layout (www site migration spec, Phase 1a): the main site (www/, a placeholder until its
  # content arrives) at the root and the catalog under /run, built, merged and checked with fixed values and deployed
  # to the branch alias www-preview of the same project, https://www-preview.<project>.pages.dev. Parallel to the
  # other jobs and needing nothing from them, with the same guards; never production (step C8 of the spec switches
  # production with the repository variable PAGES_MERGED). PAGES_NOINDEX=1: dist/_headers and a robots.txt that
  # allows nothing, at the root and under /run. The Functions stay in the upload until Phase 1c; with PAGES_MERGED they
  # leave every request to a *.pages.dev address alone (lib/core/site-host.ts).
  www-preview-build:
    name: www preview build
    if: ${{ !github.event.repository.private && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.settings.outputs.deploy }}
      commit: ${{ steps.checkout.outputs.commit }}
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      MCP_URL: ${{ vars.MCP_URL }}
      WEBMCP_OT_TOKENS: ${{ vars.WEBMCP_OT_TOKENS }}
      SITE_URL: https://www.openmercato.com
      BASE_PATH: /run
      HOME_PATH: /modules
      PAGES_NOINDEX: "1"
      PAGES_MERGED: "1"
      PAGES_SERVE_ORIGIN: ""
    steps:
      - name: Check deploy settings
        id: settings
        # only a run on main deploys a preview, as the build job
        env:
          HAS_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ "$HAS_ACCOUNT_ID" = "true" ] && [ "$ON_MAIN" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Read data branch
        run: |
          err="$(mktemp)"
          if git fetch --no-tags --depth=1 origin +refs/heads/data:refs/remotes/origin/data 2>"$err"; then
            git worktree add --detach .data origin/data
          elif grep -q "couldn't find remote ref" "$err"; then
            mkdir -p .data
            echo "No data branch yet: building on empty data." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cat "$err"
            echo "::error::Cannot read the data branch; not deploying."
            exit 1
          fi

      - name: Build
        # the catalog to dist-run/, the main site to dist-www/
        run: yarn build

      - name: Merge
        run: yarn om pages-site --merge

      - name: Write Functions config
        run: yarn om pages-site

      - name: Check merged contents
        # the merged layout as a whole: the catalog's nested checks, the root files, the sitemap index, the links of
        # every page against the routes this build wrote, and the noindex files
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          test -f dist/run/.well-known/agent-skills/index.json || { echo "dist/run/.well-known/agent-skills/index.json is missing"; exit 1; }
          test -f dist/_headers || { echo "dist/_headers is missing"; exit 1; }
          yarn om pages-site --check dist

      - name: Check Pages limits
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          yarn wrangler pages project validate dist
          echo "dist: $(find dist -type f | wc -l | tr -d ' ') files"

      - name: Check Pages Functions
        env:
          WRANGLER_SEND_METRICS: "false"
        run: yarn wrangler pages functions build functions --outdir "$RUNNER_TEMP/functions"

      - name: Smoke test the merged upload
        # as in the build job (scripts/pages-smoke.sh)
        timeout-minutes: 4
        run: scripts/pages-smoke.sh dist

      - name: Upload preview
        if: ${{ steps.settings.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: www-preview
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  www-preview:
    name: www preview
    needs: www-preview-build
    if: ${{ needs.www-preview-build.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare
      url: ${{ steps.summary.outputs.url }}
    env:
      SITE_URL: https://www.openmercato.com
      BASE_PATH: /run
      HOME_PATH: /modules
      PAGES_NOINDEX: "1"
      PAGES_MERGED: "1"
      PAGES_SERVE_ORIGIN: ""
      PREVIEW_BRANCH: www-preview
    steps:
      - name: Check token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=pages not deployed::CLOUDFLARE_ACCOUNT_ID is set but environment cloudflare has no CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.www-preview-build.outputs.commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Download preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: www-preview
          path: dist

      - name: Write Functions config
        run: yarn om pages-site

      - name: Check downloaded preview
        run: |
          test -f dist/run/.well-known/agent-skills/index.json || { echo "dist/run/.well-known/agent-skills/index.json is missing"; exit 1; }
          test -f dist/_headers || { echo "dist/_headers is missing"; exit 1; }
          yarn om pages-site --check dist

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          packageManager: yarn
          # a branch other than main is a preview deployment of the project, never production
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ env.PREVIEW_BRANCH }} --commit-dirty=true

      - name: Preview summary
        id: summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          alias="$(printf '%s' "$PREVIEW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//')"
          url="https://$alias.$CF_PAGES_PROJECT.pages.dev/"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "Preview of the merged layout deployed to branch \`$PREVIEW_BRANCH\` of Cloudflare Pages project \`$CF_PAGES_PROJECT\`: $url (the catalog at ${url}run/modules)"
            echo ""
            echo "This deployment: ${DEPLOYMENT_URL:-see the wrangler output}"
          } >> "$GITHUB_STEP_SUMMARY"
