# Weekly full sync (spec 5.1, 5.2): npm, GitHub, deps.dev, OSV, downloads, stars, type and claims, then health,
# one commit on the data branch through lib/sources/data-branch.ts. Discovery proposals go to one issue,
# "Discovered packages", edited in place (never new comments, never automatic entries).
name: sync

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Prepare data checkout
        # data-branch.ts resets this worktree to origin/data (or an orphan on the first run) before every attempt.
        run: git worktree add --detach .data HEAD

      - name: Sync and commit to data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # data-branch.ts pushes with the job token, set explicitly for this step only (checkout keeps no credentials).
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${GIT_CONFIG_VALUE_0#AUTHORIZATION: basic }"
          export GIT_CONFIG_VALUE_0
          node lib/sources/data-branch.ts --dir .data --message "chore(data): sync $(date -u +%Y-%m-%dT%H:%M:%SZ)" -- \
            bash -euo pipefail -c '
              yarn om sync --all
              yarn om health --all
            '

      - name: Discover packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: yarn om discover

      - name: Update the discovery issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Discovered packages"
          number="$(gh issue list --state open --label discovery --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file out/discover.md
            echo "Updated issue #$number."
          else
            gh issue create --title "$title" --label discovery --body-file out/discover.md
          fi
