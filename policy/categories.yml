  - id: crm-sales
    title: "CRM & Sales"
    wedge: sell
    aliases: [crm]
  - id: catalog-pricing
    title: "Catalog & Pricing"
    wedge: sell
    aliases: [catalog]
  - id: orders-checkout
    title: "Orders & Checkout"
    wedge: sell
    aliases: [commerce, checkout]
  - id: marketing-loyalty
    title: "Marketing & Loyalty"
    wedge: sell
    aliases: [marketing]
