# The Strapi project is a Yarn project of its own (spec, The cms/ folder): this file restates the rules of the root
# .yarnrc.yml, which Yarn also reads from the parent directory.
nodeLinker: node-modules
# dependency scripts are disabled; exceptions only through dependenciesMeta.<pkg>.built: true with a comment. None is
# needed: @swc/core, esbuild and core-js-pure list scripts, but their binaries come from optional platform packages and
# `strapi build` runs without the scripts (checked with 5.64.0).
enableScripts: false
enableTelemetry: false
npmMinimalAgeGate: 14d
# Strapi publishes every @strapi/* package of a release on one day and the spec pins the release exactly (5.64.0 of
# 25 Nov 2026), so the gate would refuse the pinned release for its first 14 days. The gate still holds for every other
# package of the tree. Remove the exception once the pinned release passes the gate (9 Dec 2026 for 5.64.0) and
# no newer @strapi/* pin needs it.
npmPreapprovedPackages:
  - "@strapi/*"
