npm: "@open-mercato/documents"
repo: open-mercato/open-mercato#main/packages/documents
category: content-portal
tags: [documents, collaboration, editor]
summary: Internal rich-text documents that staff co-edit in real time, with folders, sharing roles, comments, versions and export.
whenToUse: Use when teams write proposals, procedures or notes inside the app and export them to .docx or PDF, instead of a separate wiki.
whenNotToUse: Real-time co-editing needs a separate WebSocket sidecar process; without it one person edits at a time.
