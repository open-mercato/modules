# Remote MCP server of Open Mercato Modules (spec 3.4, 8.3). Deployed only by .github/workflows/mcp-deploy.yml.
# Local run: yarn wrangler dev --config mcp/wrangler.toml (override the URLs with --var NAME:value).
name = "om-modules"
main = "worker.ts"
compatibility_date = "2026-10-01"

# The index URLs are the address of the site on Cloudflare Pages (pages.yml, 28 Oct). Until that domain serves the
# catalog the Worker answers its tools with "Catalog data is unavailable", or these are overridden. The Worker's own
# address is not here: it becomes the repo variable MCP_URL after the first deploy, and nothing advertises an MCP URL
# before that.
[vars]
MODULES_INDEX_URL = "https://modules.openmercato.com/modules.json"
BUILTIN_INDEX_URL = "https://modules.openmercato.com/built-in.json"

[observability]
enabled = false
