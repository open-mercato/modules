nodeLinker: node-modules
enableScripts: false # dependency scripts are disabled; exceptions only through dependenciesMeta.<pkg>.built: true with a comment
enableTelemetry: false
npmMinimalAgeGate: 14d
npmPreapprovedPackages:
  - "@open-mercato/*"
# @astrojs/astro2tsx 0.1.2 (wasm only) loads @napi-rs/wasm-runtime, whose peer @emnapi/runtime it does not
# provide, so `astro check` cannot import @astrojs/check. Fix the upstream metadata here; remove when fixed upstream.
packageExtensions:
  "@astrojs/astro2tsx@0.1.2":
    dependencies:
      "@emnapi/runtime": "1.11.3"
