comparison:
  title: Explore implementation and commercial details
  label: What matters
  columns:
    - Order-management requirement
    - Open Mercato
  rows:
    - topic: Order intake
      theirs: Which channels create the order and who validates it?
      ours: Sales APIs and extensible workflows support the intake integrations you scope.
    - topic: Commercial context
      theirs: Can pricing, discounts and taxes be explained?
      ours: Catalog pricing and sales adjustments keep the calculation attached to the record.
    - topic: Partial fulfilment
      theirs: Can one order ship in several parts?
      ours: Multiple shipments can fulfil quantities from the same order.
    - topic: Tracking
      theirs: Where can customer service see a shipment update?
      ours: Shipment records can be connected to carrier and ERP integrations.
    - topic: System ownership
      theirs: Where do stock, invoicing and financial truth live?
      ours: Define those boundaries in the project and connect the appropriate systems.
