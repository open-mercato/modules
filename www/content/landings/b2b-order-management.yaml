steps:
  title: Prove the flow on a representative set of orders.
  items:
    - title: Map the order journey
      body: List intake channels, pricing decisions, approvals, fulfilment steps and customer notifications.
    - title: Connect the master data
      body: Map customer, SKU, tax, carrier and ERP identifiers. Decide how stock and financial records will be synchronized.
    - title: Test the exceptions
      body: Rehearse partial shipments, cancellations, price changes, returns and failed integration calls as required by your business.
    - title: Roll out with operations
      body: Start with one channel or warehouse, reconcile transactions and train the team that handles exceptions.
faq:
  title: Questions before you take the next step.
  items:
    - question: Does it connect to our carrier?
      answer: Carrier-driven shipment creation requires a configured carrier integration. Review the carriers and services you use during scoping, then test labels, status updates and exception handling.
    - question: Can it handle split shipments?
      answer: The Sales module supports multiple shipments against an order, with quantities and remaining fulfilment visible. Your warehouse process can build on that foundation.
    - question: Can we connect our B2B portal or ERP?
      answer: Yes, integrations can be implemented through the API and extension architecture. The work depends on each system's interface, identifiers, data ownership and synchronization requirements.
    - question: Is warehouse inventory included in every deployment?
      answer: Inventory and warehouse requirements should be scoped alongside order management. Define reservations, locations, units, picking and stock ownership before choosing the modules and integrations for production.
cta:
  title: Bring your most difficult order exception.
  body: A split shipment, a custom price or a missing tracking update is a useful starting point for a focused implementation conversation.
  primary:
    label: Discuss your order workflow
    href: /contact?interest=b2b-order-management
  note: Talk through your process, integrations and implementation needs with the Open Mercato team.
