pains:
  title: An order should arrive with the context people need to fulfil it.
  items:
    - title: Orders arrive through several channels
      body: Email, portals and sales teams can leave operations with repeated entry. Scope each intake source and connect it to a validated order workflow.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Inventory and order status drift apart
      body: A customer promise depends on up-to-date information. Define the system of record and synchronization rules before adding availability and fulfilment views.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: Packing and shipping create another handoff
      body: Labels, packing notes and tracking details often live separately. Bring them into the same operational chain, with the carrier and ERP integrations your business uses.
      art:
        src: /media/landings/6af5f54c28ee1822c15f9c7c-om-lp-workflow-v3.svg
        alt: ""
        decorative: true
