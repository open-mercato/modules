steps:
  title: A Close migration plan for records, relationships and workflows.
  items:
    - title: Map the records and relationships
      body: Inventory Leads, nested Contacts, Opportunities, statuses, custom fields, activities and Smart Views. Keep original identifiers and agree how each record maps to the new application.
    - title: Audit the behaviors you depend on
      body: Review phone numbers, call recordings, SMS consent, dialers, workflows and email accounts. Decide what to retain, integrate or reimplement and agree acceptance criteria.
    - title: Rehearse with one team
      body: Load a representative sample, validate permissions and relationships, and test a real customer journey from first activity to the operational handoff.
    - title: Reconcile, train and cut over
      body: Compare record counts and key totals, retain an accessible archive where needed, handle final changes and agree rollback, training and support ownership.
faq:
  title: Questions before you take the next step.
  items:
    - question: When is Open Mercato a good Close alternative?
      answer: When you need an owned, extensible CRM and operational application, and have a team or partner to implement and run it. Close can remain the better fit when its ready-to-use managed experience already matches your requirements.
    - question: Will all our Close features transfer?
      answer: No automatic feature transfer is assumed. Review phone numbers, call recordings, SMS consent, dialers, workflows and email accounts. The core provides CRM and sales modules; specialized capabilities require configuration, integrations or development.
    - question: How should we compare the cost?
      answer: "Compare the same scope over the same period: current subscriptions and administration versus implementation, migration, hosting, maintenance, support and provider usage. The MIT core has no licence charge; a production service still has costs."
    - question: Can we keep part of our current stack?
      answer: Yes, a phased architecture can be scoped. Define the system of record for each entity, the synchronization rules and failure handling, then validate them before moving users.
