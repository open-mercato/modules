pains:
  title: Keep communication costs and post-sale workflows in the migration plan.
  items:
    - title: Your costs include seats and communication usage
      body: "Close combines seat pricing with calling, SMS and AI usage. Compare the full stack: an open-source CRM removes the core licence charge, but communication services and their usage still cost money."
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: The process continues after the call
      body: If your team needs order approvals, fulfilment or specialized account records, scope an operational CRM around that work. Preserve the outbound capabilities that are essential to your sales motion.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map Leads, nested Contacts, Opportunities, statuses, custom fields, activities and Smart Views. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
