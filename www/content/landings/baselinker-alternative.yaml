steps:
  title: Migrate the order flow without breaking fulfilment.
  items:
    - title: Inventory the working connections
      body: List marketplaces, stores, carriers, ERP systems, warehouses, currencies and every automatic action. Identify which connections can stay during a phased rollout.
    - title: Map the operational data
      body: Preserve SKU and offer identifiers, order statuses, addresses, payments and shipment references. Assign the system of record for stock and prices.
    - title: Pilot one channel end to end
      body: Test order intake, updates, stock behavior, cancellations, payment reconciliation, labels and tracking. Include retries, duplicate prevention and failure alerts.
    - title: Reconcile and switch carefully
      body: Set a data freeze and final synchronization plan, reconcile open orders, train operators and retain a tested rollback path.
faq:
  title: Questions before you take the next step.
  items:
    - question: Is Open Mercato a drop-in BaseLinker replacement?
      answer: No. Base provides a large catalog of ready-made ecommerce integrations. Open Mercato is a custom application foundation. The required marketplace, carrier and ERP connections must be assessed and implemented before switching.
    - question: Does Open Mercato charge per order?
      answer: The MIT-licensed core has no per-order licence fee. Hosting, implementation, maintenance, support and external-provider usage still contribute to total cost.
    - question: Can we keep Base for marketplace connectivity?
      answer: A hybrid architecture can be scoped with Base handling selected channels and Open Mercato owning customer or operational processes. Define record ownership, synchronization and error handling before implementing it.
    - question: When is this a good fit?
      answer: When a distinctive operational workflow, code ownership or long-term application control justifies a custom implementation. A standard connector-led shop may be better served by a ready-made ecommerce platform.
cta:
  title: Bring the order exceptions your current setup cannot handle cleanly.
  body: Start with your channels, monthly order range, ERP and fulfilment rules. Scope a practical pilot before committing to a full migration.
  primary:
