pains:
  title: The Salesforce budget includes seats, add-ons and specialist time.
  items:
    - title: More users, editions and add-ons
      body: Salesforce's commercial model combines user subscriptions with edition-dependent capabilities and add-ons. Review your actual contract against an Open Mercato implementation budget covering hosting, delivery and support.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Simple changes need specialist time
      body: Salesforce can be highly customized. Reviewers also describe a demanding setup and learning curve. Open Mercato gives your engineering team an extensible TypeScript foundation and control over the screens and rules they build.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Migration includes relationships and business logic
      body: Accounts are only part of the migration. Relationships, activity history and business logic matter too. Start with one team and a tested data map so the decision is grounded in a working pilot.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
