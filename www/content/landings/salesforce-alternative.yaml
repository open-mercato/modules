steps:
  title: A Salesforce migration needs a record map and a workflow map.
  items:
    - title: Inventory the Salesforce setup
      body: List Salesforce objects, fields, reports, Flows, Apex, add-ons and integrations your team depends on.
    - title: Map and rehearse the data
      body: Map Accounts, Contacts and Opportunities to companies, people and deals. Preserve source IDs and verify relationships, files and activity history.
    - title: Rebuild the essential workflows
      body: Implement required automations and integrations. Pilot one team with representative deals and agree acceptance criteria.
    - title: Plan the cutover
      body: Reconcile records, test permissions, agree a data freeze and recovery plan, then train users and assign support ownership.
faq:
  title: Questions before you take the next step.
  items:
    - question: Can Open Mercato replace our Salesforce setup?
      answer: Fit depends on the Salesforce products and customizations you use. The core covers customer and deal management. Advanced forecasting, CPQ, Service Cloud and specialist apps need a capability-by-capability assessment and may require additional development.
    - question: Will Salesforce Flows and Apex migrate automatically?
      answer: Treat Flows, Apex and installed apps as business requirements to review and reimplement where needed. The migration plan should include behavior tests as well as data imports.
    - question: Will it cost less?
      answer: The core has a $0 licence fee. Compare your full Salesforce contract and administration costs with the proposed implementation, hosting, integrations and support over the same time period. The result depends on your scope.
    - question: Can we move one team first?
      answer: A phased pilot can be scoped around one team or workflow. Agree which system owns each record, how updates move between systems and the point at which the pilot is ready to expand.
cta:
  title: Start with the Salesforce work you want to improve.
  body: Bring your object list, integrations and three workflows that create the most friction. Use them to scope a practical migration conversation.
  primary:
    label: Discuss your Salesforce migration
    href: /contact?interest=salesforce-alternative
  note: Talk through your process, integrations and implementation needs with the Open Mercato team.
