comparison:
  title: Explore implementation and commercial details
  label: What matters
  columns:
    - Salesforce
    - Open Mercato
  rows:
    - topic: Core sales records
      theirs: Accounts, contacts, leads and opportunities in a managed product.
      ours: Companies, people, deals, notes and activities in an extensible application.
    - topic: Commercial model
      theirs: Per-user plans with edition and add-on choices.
      ours: MIT-licensed core. Implementation, hosting and support are scoped services.
    - topic: Customization
      theirs: Flow, platform configuration, Apex and ecosystem applications.
      ours: TypeScript modules, custom fields, entities and application-level extensions.
    - topic: Hosting
      theirs: Salesforce-managed platform infrastructure.
      ours: Choose and operate your deployment environment.
    - topic: Integrations
      theirs: A large application ecosystem and platform APIs.
      ours: APIs and extension points for the integrations your project needs.
    - topic: Migration scope
      theirs: Inventory the clouds, automations and add-ons in use.
      ours: Map each required capability to core, configuration, integration or custom development.
