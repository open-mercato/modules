pains:
  title: A Dynamics migration must account for the Microsoft dependencies.
  items:
    - title: Licensing is only part of the decision
      body: "Dynamics 365 Sales has role and edition choices alongside other Microsoft business applications. Compare the complete operating scope: licensing, administration, integrations and future changes."
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Every change touches a wider Microsoft architecture
      body: If your CRM depends on Dataverse, Power Automate and custom plug-ins, replacement is an architecture decision. Open Mercato offers a TypeScript application foundation; the migration plan must account for those dependencies.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map Accounts, Contacts, Leads, Opportunities, custom tables, activities, owners and security roles. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
