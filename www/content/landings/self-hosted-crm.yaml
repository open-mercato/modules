        alt: ""
        decorative: true
    - title: A pipeline you can configure
      body: Use deal stages, values, probabilities and expected close dates in list and kanban views.
      art:
        src: /media/landings/6af5f54b8284a0c81e2b6c4d-om-lp-pipeline-v3.svg
        alt: ""
        decorative: true
    - title: Your business data model
      body: Add custom fields and entities, then extend the application with purpose-built modules.
      art:
        src: /media/landings/6af5f54d0e00f12bff84c20b-om-lp-operations-v3.svg
        alt: ""
        decorative: true
    - title: Access that follows responsibility
      body: Use roles, feature permissions and organization scope to define who can view and change records.
