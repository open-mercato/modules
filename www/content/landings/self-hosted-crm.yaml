steps:
  title: Plan the deployment, data import and ongoing maintenance.
  items:
    - title: Define the environment
      body: Agree hosting region, organizations, access roles and who will run the service.
    - title: Prepare the customer data
      body: Map accounts, contacts, deals and source identifiers. Clean duplicates and test a sample import.
    - title: Rehearse real work
      body: Run a pilot with sales users. Verify permissions, key integrations and a backup restoration.
    - title: Move into production
      body: Agree cutover, recovery steps, monitoring and support ownership before wider rollout.
faq:
  title: Questions before you take the next step.
  items:
    - question: Is Open Mercato free to self-host?
      answer: The core software is MIT licensed. Budget separately for infrastructure, configuration, custom development and ongoing operations. A delivery partner can quote those services for your scope.
    - question: Can we migrate an existing CRM?
      answer: A migration starts with your export or API access, a record and relationship map, and a sample import. Workflows, attachments and integrations need their own validation. The delivery scope depends on the source system.
    - question: Who maintains the deployment?
      answer: Your internal team or a contracted partner. Agree patching, monitoring, backup restoration, incident handling and response times in the operating plan.
    - question: Can we try the interface first?
      answer: Yes. Explore the public demo, create a sandbox or inspect the repository. A production deployment should then be configured and tested against your business requirements.
cta:
  title: Bring your workflow and hosting requirements.
  body: Tell us where the data should live, how many people need access and what your current CRM makes difficult. We can help you find an implementation route.
  primary:
    label: Discuss your deployment
    href: /contact?interest=self-hosted-crm
  note: Talk through your process, integrations and implementation needs with the Open Mercato team.
