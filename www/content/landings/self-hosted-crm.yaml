pains:
  title: Owning the server should come with a workable operating plan.
  items:
    - title: The seat bill grows with your team
      body: Giving more colleagues access adds another recurring cost. The open-source core has a $0 licence fee, so the commercial discussion can focus on hosting, delivery and support.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: A basic CRM becomes a collection of workarounds
      body: Your accounts, approvals and customer history need to fit together. Extend records and workflows in one application instead of maintaining an ever-growing set of disconnected tools.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Maintenance lands on one person's evenings
      body: Self-hosting needs someone to own updates, backups and recovery. Choose an internal operator or delivery partner and agree those responsibilities as part of the rollout.
      art:
        src: /media/landings/6af5f54c44a15bad8e0b9549-om-lp-access-v3.svg
        alt: ""
        decorative: true
