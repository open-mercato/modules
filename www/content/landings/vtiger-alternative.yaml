      body: Link companies and people to deals, addresses, notes and activities. Extend the records with fields that describe your business.
      art:
        src: /media/landings/6af5f54bc76a29afdf67a3ca-om-lp-customers-v3.svg
        alt: ""
        decorative: true
    - title: Configurable sales stages
      body: Configure stages and track deal value, probability, expected close and ownership in board or list views.
      art:
        src: /media/landings/6af5f54b8284a0c81e2b6c4d-om-lp-pipeline-v3.svg
        alt: ""
        decorative: true
    - title: Quotes, orders and shipments
      body: Use the sales and catalog modules for quotes, orders, products, payments and shipment records. Implement the handoffs and provider connections your process needs.
      art:
        src: /media/landings/6af5f54b80a055a87fa948c5-om-lp-orders-v3.svg
        alt: ""
        decorative: true
    - title: Custom entities and workflows
      body: Extend the TypeScript application with your own entities, modules and workflows. Assess PHP extensions, workflow handlers, document templates, mail integrations and customer portal as explicit migration work.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
