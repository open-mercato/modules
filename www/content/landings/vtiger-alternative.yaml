comparison:
  title: Explore implementation and commercial details
  label: What matters
  columns:
    - Vtiger
    - Open Mercato
  rows:
    - topic: Customer records
      theirs: Vtiger provides CRM records and sales processes.
      ours: Companies, people, deals, notes and activities in the core application.
    - topic: Customization
      theirs: Vtiger Open Source; not cloud suite. Existing configurations need a capability review.
      ours: Custom fields, entities and TypeScript modules; implementation scoped to the workflow.
    - topic: Operational handoff
      theirs: Review the modules and connected systems used after a sale.
      ours: Sales and catalog modules provide a starting point for quotes, orders and shipment records.
    - topic: Hosting and cost
      theirs: Open-source deployment and services.
      ours: MIT-licensed core; hosting, implementation, maintenance and third-party usage budgeted separately.
    - topic: Migration detail
      theirs: Php extensions, workflow handlers, document templates, mail integrations and customer portal.
      ours: Keep source identifiers, verify relationships and rebuild required behavior in a tested pilot.
