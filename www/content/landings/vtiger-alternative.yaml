pains:
  title: Check your Vtiger edition and the extensions you need to migrate.
  items:
    - title: Cloud and open-source editions are different products
      body: Vtiger offers both a cloud suite and an open-source edition. Identify which features and extensions you actually use before selecting a replacement; the scope cannot be inferred from the brand name alone.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Your next change needs application-level development
      body: For teams standardizing on TypeScript, Open Mercato offers CRM, sales and catalog modules in that stack. Compare the effort to extend your current Vtiger deployment with building the next workflow on this foundation.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map Accounts, Contacts, Leads, Opportunities, products, quotes, orders, custom modules and relations. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
features:
  title: Customer records, sales pipelines and order workflows.
  items:
