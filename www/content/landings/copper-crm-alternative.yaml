pains:
  title: Assess plan limits and the Google Workspace connections you rely on.
  items:
    - title: More contacts and reporting change the plan
      body: Copper ties contact allowances, workflows and custom reporting to its subscription levels. Assess your actual needs alongside an Open Mercato deployment whose data model and core licence are under your control.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: A Gmail-first workflow meets a more complex process
      body: Copper is built around convenient relationship management. When contracts, deliveries or industry records need their own screens, an owned application gives your team room to build those workflows.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map People, Companies, Leads, Opportunities, Projects, custom fields and linked activities. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
