steps:
  title: A Copper migration plan for records, relationships and workflows.
  items:
    - title: Map the records and relationships
      body: Inventory People, Companies, Leads, Opportunities, Projects, custom fields and linked activities. Keep original identifiers and agree how each record maps to the new application.
    - title: Audit the behaviors you depend on
      body: Review Gmail extensions, Google Calendar, email history, enrichment and reporting. Decide what to retain, integrate or reimplement and agree acceptance criteria.
    - title: Rehearse with one team
      body: Load a representative sample, validate permissions and relationships, and test a real customer journey from first activity to the operational handoff.
    - title: Reconcile, train and cut over
      body: Compare record counts and key totals, retain an accessible archive where needed, handle final changes and agree rollback, training and support ownership.
faq:
  title: Questions before you take the next step.
  items:
    - question: When is Open Mercato a good Copper alternative?
      answer: When you need an owned, extensible CRM and operational application, and have a team or partner to implement and run it. Copper can remain the better fit when its ready-to-use managed experience already matches your requirements.
    - question: Will all our Copper features transfer?
      answer: No automatic feature transfer is assumed. Review Gmail extensions, Google Calendar, email history, enrichment and reporting. The core provides CRM and sales modules; specialized capabilities require configuration, integrations or development.
    - question: How should we compare the cost?
      answer: "Compare the same scope over the same period: current subscriptions and administration versus implementation, migration, hosting, maintenance, support and provider usage. The MIT core has no licence charge; a production service still has costs."
    - question: Can we keep part of our current stack?
      answer: Yes, a phased architecture can be scoped. Define the system of record for each entity, the synchronization rules and failure handling, then validate them before moving users.
