steps:
  title: Start with a handful of representative accounts.
  items:
    - title: Choose the account patterns
      body: Include a frequent buyer, a negotiated-price account and a customer with multiple delivery locations.
    - title: Map the commercial records
      body: Clean company and contact data, preserve ERP IDs and define pricing ownership.
    - title: Pilot the daily work
      body: Run a new quote, a repeat order and a delivery query with the account managers who handle them.
    - title: Expand with evidence
      body: Measure repeated entry, pricing corrections and time spent answering order questions before adding more accounts.
faq:
  title: Questions before you take the next step.
  items:
    - question: Can each customer have different pricing?
      answer: The catalog provides product, variant and channel pricing foundations. Customer contracts, volume tiers and negotiated exceptions should be specified and tested in your implementation.
    - question: Can orders arrive by email or WhatsApp?
      answer: Those intake channels require appropriate integrations and validation. Scope how a message becomes a draft order, who approves it and how customer and SKU matching work.
    - question: Do we have to replace our ERP?
      answer: A wholesale CRM can operate alongside your current ERP. Define which system owns the customer, price, stock and invoice records, then scope the required connections.
    - question: Can we add an ordering portal later?
      answer: The API and modular architecture provide a foundation for a customer portal. Authentication, customer-specific catalogs, pricing and order permissions belong in that portal's delivery scope.
cta:
  title: Bring an account your team knows by heart.
  body: Its contacts, pricing agreements and order history will help define what the CRM needs to make available to everyone who serves it.
  primary:
    label: Discuss your wholesale CRM
    href: /contact?interest=crm-for-wholesale-distributors
  note: Talk through your process, integrations and implementation needs with the Open Mercato team.
