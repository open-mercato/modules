pains:
  title: A batch question should have a clear place to start.
  items:
    - title: The history is spread across files
      body: Supplier LOTs, production notes and shipment records can require a manual reconstruction. TraceCore connects the records around the batch.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: The recipe and actual consumption drift apart
      body: The intended recipe is only part of the story. Tie production work to the materials and LOTs actually used.
      art:
        src: /media/landings/6af5f54c28ee1822c15f9c7c-om-lp-workflow-v3.svg
        alt: ""
        decorative: true
    - title: The commercial record ends at the factory door
      body: A traceability investigation also needs customer and order context. Connect sales, production and warehouse information in the same system.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
