steps:
  title: Start with one product family and its LOT history.
  items:
    - title: Map the traceability chain
      body: Identify supplier LOTs, recipes, production records, stock movements and shipment references.
    - title: Define the domain rules
      body: Agree units, expiry, material substitutions, corrections and the records the quality team needs.
    - title: Rehearse a batch investigation
      body: Load representative data and follow an input LOT through production to the customer order. Review missing links.
    - title: Validate and roll out
      body: Agree acceptance criteria, access, retention and operating procedures before introducing the system more widely.
faq:
  title: Questions before you take the next step.
  items:
    - question: Is TraceCore part of the basic CRM?
      answer: TraceCore is a specialist manufacturing implementation built on Open Mercato. Its production, warehouse and LOT capabilities belong to that domain product and implementation scope.
    - question: Does the software guarantee regulatory compliance?
      answer: Your quality and compliance requirements need their own assessment and validation. Scope audit evidence, electronic records, signatures, retention and operational procedures with the responsible specialists.
    - question: Can we deploy it on premises?
      answer: TraceCore's published deployment options include on-premise and dedicated VPS. Discuss infrastructure, backup, recovery and support requirements with the implementation team.
    - question: Can historical spreadsheet data be imported?
      answer: Historical data needs mapping and quality checks. A sample helps establish whether LOT, material, production and shipment relationships can be reconstructed and what gaps remain.
cta:
  title: Bring one batch and the questions it needs to answer.
  body: Use its supplier LOTs, production records and customer orders to scope a traceability workflow with the right domain team.
  primary:
    label: Discuss your traceability workflow
    href: /contact?interest=lot-traceability-software
  note: Talk through your process, integrations and implementation needs with the Open Mercato team.
