pains:
  title: Seat bundles and automation limits affect the next workflow.
  items:
    - title: Seat bundles do not match the team
      body: monday paid plans start at three seats and use larger seat bundles as teams grow. Open Mercato has no per-user core licence fee; compare that with the real cost of implementation and operation.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: The next automation needs more than another board
      body: monday CRM has configurable automations and plan-specific allowances. When a process spans several records and external systems, define the rule in an owned application and test the complete handoff.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map Boards, items, subitems, linked contacts, companies, deal stages, owners and updates. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
