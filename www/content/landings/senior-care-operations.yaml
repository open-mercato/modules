steps:
  title: Start with one branch's real coordination process.
  items:
    - title: Map the service
      body: Describe clients, caregivers, branches, care orders and the records needed to confirm a visit.
    - title: Review local requirements
      body: Identify privacy, access, billing, signature and visit-verification requirements with the responsible team.
    - title: Prototype the branch workflow
      body: Adapt the demo to representative schedules, changes and disputed or missing confirmations.
    - title: Validate before production
      body: Test usability, devices, integrations and recovery, then agree support and rollout responsibilities.
faq:
  title: Questions before you take the next step.
  items:
    - question: Is this a production-ready care platform we can buy today?
      answer: The reference shown here is a hackathon workflow demo. A production system requires scoped development, integration, validation and operating arrangements for your organization.
    - question: Does it include US Medicaid EVV or insurance billing?
      answer: Those capabilities are outside the demonstrated German non-medical care workflow. If they are required, assess their interfaces, certification and implementation needs as part of the project.
    - question: Can caregivers work offline?
      answer: Offline and device behavior must be designed and verified for the implementation. Bring the devices, connectivity conditions and daily tasks your caregivers use to the evaluation.
    - question: Why start from this demo?
      answer: It gives your team a concrete model of clients, schedules and confirmation states to review. You can identify the changes your operation needs before committing to a full production scope.
cta:
  title: Bring a week's schedule and its unfinished paperwork.
  body: We can help you assess where a tailored workflow could connect the visits, people and confirmations your team manages.
