pains:
  title: Keep schedules, care orders and service confirmations connected.
  items:
    - title: A schedule change affects several people
      body: Distributed teams need the client, care order and assigned visit to stay connected. The demo shows a shared operational view for branch managers.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: A completed visit still needs confirmation
      body: Missing signatures and disputed records create follow-up work. Model each confirmation state and make the next action visible.
      art:
        src: /media/landings/6af5f54c28ee1822c15f9c7c-om-lp-workflow-v3.svg
        alt: ""
        decorative: true
    - title: The software's workflow misses a local rule
      body: Care operators have specific branch and documentation processes. Use a customizable foundation to scope those rules with the team responsible for them.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
