pains:
  title: Contact tiers and campaign-based operations shape the migration.
  items:
    - title: A larger contact database changes the bill
      body: Keap prices additional contacts in tiers. Open Mercato does not charge a core licence fee per contact; hosting capacity, email delivery, implementation and support remain part of the operating budget.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Tags and campaigns are doing operational work
      body: If your delivery process depends on long chains of tags and campaign rules, model the underlying contracts, services or orders directly and implement their lifecycle in Open Mercato.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map Contacts, companies, tags, opportunities, custom fields, campaign membership and consent. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
features:
  title: Customer records, sales pipelines and order workflows.
  items:
    - title: Linked customer records
      body: Link companies and people to deals, addresses, notes and activities. Extend the records with fields that describe your business.
      art:
        src: /media/landings/6af5f54bc76a29afdf67a3ca-om-lp-customers-v3.svg
        alt: ""
        decorative: true
    - title: Configurable sales stages
      body: Configure stages and track deal value, probability, expected close and ownership in board or list views.
      art:
        src: /media/landings/6af5f54b8284a0c81e2b6c4d-om-lp-pipeline-v3.svg
        alt: ""
        decorative: true
    - title: Quotes, orders and shipments
      body: Use the sales and catalog modules for quotes, orders, products, payments and shipment records. Implement the handoffs and provider connections your process needs.
      art:
        src: /media/landings/6af5f54b80a055a87fa948c5-om-lp-orders-v3.svg
        alt: ""
        decorative: true
    - title: Custom entities and workflows
      body: Extend the TypeScript application with your own entities, modules and workflows. Assess campaign goals, landing pages, payment links, appointments and email deliverability as explicit migration work.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
