pains:
  title: Porównaj koszty zamówień, własne reguły i dostępne integracje.
  items:
    - title: Wolumen rośnie razem z rachunkiem
      body: Base łączy abonament z opłatami zależnymi od zamówień i osobną ofertą Enterprise. Porównaj koszt swojego konta z pełnym budżetem wdrożenia, hostingu i utrzymania własnej aplikacji.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Wyjątki stały się codziennym procesem
      body: Akceptacje B2B, nietypowe reguły realizacji i wymiana danych z ERP nie powinny zależeć od kolejnego ręcznego obejścia. Zaimplementuj je wokół własnych danych klientów i zamówień.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Działających integracji nie można zgubić po drodze
      body: Base ma rozbudowany katalog gotowych połączeń. Przed migracją spisz każdy marketplace, sklep, system ERP i przewoźnika. Integracje Open Mercato wymagają osobnej oceny i wdrożenia.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
