pains:
  title: Custom objects and advanced features change the HubSpot budget.
  items:
    - title: Custom objects require HubSpot Enterprise
      body: Reviewers point to cost increases when moving into advanced features. HubSpot's custom objects require an Enterprise subscription. Scope your own data model on Open Mercato with implementation effort made explicit.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Your business stops fitting the standard records
      body: Assets, contracts, locations and service processes can become awkward when everything is forced into a contact or deal. Add purpose-built entities and relationships around the work you actually do.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: Moving customer history feels risky
      body: Deal stages, associations and activity context need to survive the move. Rehearse those relationships with a sample before deciding how much of the sales workflow to migrate.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
