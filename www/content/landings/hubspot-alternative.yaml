steps:
  title: Move the relationships that make your CRM useful.
  items:
    - title: Define the sales scope
      body: Inventory contacts, companies, deals, pipelines, custom objects, reports and the Hubs your sales team uses.
    - title: Map records and associations
      body: Preserve source IDs, owners, stages and company-contact-deal relationships. Decide how activity history and attachments will be retained.
    - title: Test the connected workflow
      body: Review sequences, email/calendar connections and marketing handoffs. Reimplement or integrate each required behavior and pilot with users.
    - title: Reconcile and switch
      body: Validate record counts and relationships, handle final changes and train the team on the new process.
faq:
  title: Questions before you take the next step.
  items:
    - question: Does this replace every HubSpot Hub?
      answer: The strongest fit is a custom Sales CRM and operational workflows. Marketing automation, ad attribution, CMS, service tooling and HubSpot-specific integrations need a separate scope review.
    - question: What happens to workflows and email sequences?
      answer: Inventory their purpose, triggers, conditions and connected services. Your implementation team can then decide which behaviors to rebuild and which services to connect.
    - question: Can we keep HubSpot for marketing?
      answer: A phased architecture can keep a marketing service connected to a custom operational CRM. Define the owner of each field, consent record and lifecycle update, then test the synchronization.
    - question: How do we estimate the migration?
      answer: Start with record volumes, custom objects, association rules, activity history and integrations. A representative export helps establish the data work before a delivery estimate is agreed.
cta:
