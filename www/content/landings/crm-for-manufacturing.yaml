steps:
  title: Pilot one product line or sales team.
  items:
    - title: Follow one real order
      body: Map the customer request, quote, approval, ERP handoff and delivery questions.
    - title: Agree the data ownership
      body: Identify customer and product masters, ERP identifiers and the systems responsible for each status.
    - title: Run the connected pilot
      body: Import a sample, configure stages and test both a standard order and an exception with sales and operations.
    - title: Measure and expand
      body: Track duplicate entry, time to answer order questions and handoff errors. Use the results to prioritize the next workflow.
faq:
  title: Questions before you take the next step.
  items:
    - question: Can we connect our current ERP?
      answer: Start by reviewing its APIs, exports and integration options. MDM NT's project shows Open Mercato operating alongside an existing ERP. Your data mappings and synchronization behavior need to be scoped.
    - question: Does this include production planning?
      answer: The CRM and Sales modules cover the commercial workflow. Manufacturing planning, recipes and LOT traceability are domain requirements that can be addressed through a specialist implementation such as TraceCore.
    - question: Can sales see stock and promised dates?
      answer: Those views depend on reliable data from your inventory and planning systems. Include availability, reservation and delivery-date rules in the integration scope and test them with real orders.
    - question: How should we judge the pilot?
      answer: Agree a baseline for re-entry, order-status response time and handoff errors. Then test the same workflow with the people who use it before expanding the rollout.
