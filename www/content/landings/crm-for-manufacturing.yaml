pains:
  title: The customer asks a simple question. Three teams chase the answer.
  items:
    - title: A won deal gets retyped downstream
      body: Quotes, customer records and order details travel between sales and operations. Build a shared handoff with explicit record ownership and a connection to the ERP.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Sales cannot see what happens after the order
      body: Delivery questions become calls to logistics. Give sales access to the shipment and order status relevant to the customer conversation.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: Your process lives in extra spreadsheets
      body: Specifications, exceptions and approvals need their own place. Extend records and workflows around the way your products are sold and delivered.
      art:
