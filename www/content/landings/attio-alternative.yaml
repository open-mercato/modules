pains:
  title: Custom objects need a plan for the work after the deal.
  items:
    - title: Your data model becomes a subscription decision
      body: Attio supports custom objects, with object allowances tied to its plans. Open Mercato lets your team extend entities and modules in the application; implementation and infrastructure still need a budget.
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: The relationship view needs an operational next step
      body: A tailored CRM can be excellent at organizing relationships. If your next requirement is an order, approval or fulfilment workflow, evaluate the sales and catalog foundation alongside the CRM.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map People, Companies, Deals, custom objects, attributes, lists, entries and relationships. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
features:
