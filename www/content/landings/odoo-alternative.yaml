steps:
  title: Start with a process you can scope and test.
  items:
    - title: Inventory the Odoo setup
      body: List apps, custom modules, Studio changes, scheduled actions, integrations and the processes they support.
    - title: Choose the first boundary
      body: Select one workflow and define record ownership. Decide which financial and operational systems it will connect to.
    - title: Prove the data and behavior
      body: Map external IDs, customer and product data, document states and required history. Test representative transactions.
    - title: Roll out and extend
      body: Reconcile the pilot, agree operating responsibilities and introduce the next process when the first is working.
faq:
  title: Questions before you take the next step.
  items:
    - question: Is Odoo too rigid to customize?
      answer: Odoo supports extensive customization through configuration, Studio and custom modules. The relevant decision is the cost and ownership of your specific changes, integrations and future upgrades.
    - question: Can Open Mercato replace all our Odoo apps?
      answer: Review the apps you actually depend on. CRM and sales foundations are available, while accounting localization, payroll and specialist business rules require a separate fit assessment and implementation scope.
    - question: Can our existing ERP stay connected?
      answer: Yes, an implementation can introduce a specific workflow alongside an ERP through integrations. MDM NT's shipping project demonstrates this approach. Your connection and synchronization rules are part of the project.
    - question: Are upgrades automatic?
      answer: Your operating team owns release planning and regression testing. Source access and modular extensions provide control over that work, while the deployment still needs active maintenance.
cta:
  title: Bring the process that still ends in a spreadsheet.
  body: We can help you scope the records, rules and integrations needed to turn it into a working application.
  primary:
