pains:
  title: Specialized workflows need customization and an upgrade plan.
  items:
    - title: Specialized workflows need custom code
      body: Odoo offers extensive customization. Reviews also describe the work needed to fit specialized processes. Open Mercato makes custom development a first-class part of the application, with modules and extension points your team can own.
      art:
        src: /media/landings/6af5f54ced23f8851fb179ef-om-lp-custom-v3.svg
        alt: ""
        decorative: true
    - title: Upgrades become their own project
      body: Odoo documents additional code adaptation and testing for customized databases. With Open Mercato, agree a release and test plan for your extensions, supported by access to the application source.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
    - title: One improvement expands into a full ERP decision
      body: A shipping problem can be a bounded implementation. Start with the workflow that creates daily friction, connect the necessary records and evaluate the next step using real operations.
      art:
        src: /media/landings/6af5f54c28ee1822c15f9c7c-om-lp-workflow-v3.svg
        alt: ""
        decorative: true
