comparison:
  title: Explore implementation and commercial details
  label: What matters
  columns:
    - Odoo
    - Open Mercato
  rows:
    - topic: Starting point
      theirs: An integrated suite of business applications.
      ours: Core CRM, sales and catalog modules plus an extensible application foundation.
    - topic: Custom development
      theirs: Studio and custom modules, with availability depending on deployment and plan.
      ours: TypeScript modules, custom entities, APIs and application extensions.
    - topic: Updates
      theirs: Customized databases require adaptation and testing during upgrades.
      ours: Your team schedules and tests application and dependency updates.
    - topic: Commercial model
      theirs: Community and commercial editions have different capabilities and terms.
      ours: MIT-licensed core, with delivery, hosting and support scoped separately.
    - topic: Specialist ERP scope
      theirs: Broad suite including accounting and manufacturing applications.
      ours: Choose domain implementations and scope accounting, localization and industry requirements individually.
    - topic: Rollout
      theirs: Select the apps and migration scope for the implementation.
      ours: Begin with a bounded workflow and integrate it with the existing system of record.
