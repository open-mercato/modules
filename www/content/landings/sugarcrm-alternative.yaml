pains:
  title: Account for licence costs and the custom Sugar logic you need to keep.
  items:
    - title: A customizable CRM still has a commercial licence
      body: "Sugar offers configurable products, including onsite Enterprise editions with per-user pricing. Open Mercato provides a different foundation: MIT-licensed core modules, with delivery and operation budgeted separately."
      art:
        src: /media/landings/6af5f54a987f197223f70d6d-om-lp-cost-v3.svg
        alt: ""
        decorative: true
    - title: Years of custom logic make a move feel expensive
      body: Your Sugar modules, relationships and business processes contain valuable knowledge. Inventory that behavior and carry it into a tested application design instead of treating migration as a contacts-only import.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
    - title: Preserve relationships and daily workflows
      body: Map Accounts, Contacts, Leads, Opportunities, custom modules, relationships and activities. Rehearse the relationships and daily workflow with a representative sample before committing to the cutover.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
