steps:
  title: Turn a broad CRM request into a testable delivery scope.
  items:
    - title: Map the work
      body: Describe users, records, decisions and handoffs. Bring examples of the cases the current tools handle poorly.
    - title: Define the first release
      body: Agree the core workflows, data model, integrations and measurable acceptance criteria.
    - title: Build with real users
      body: Configure and extend the foundation, rehearse imports and test a complete workflow with representative data.
    - title: Deliver the operating model
      body: Document deployment, support and maintenance responsibilities. Train the team and agree the next release priorities.
faq:
  title: Questions before you take the next step.
  items:
    - question: Who builds the custom CRM?
      answer: Your internal engineering team or an Open Mercato implementation partner. The partner directory includes agencies offering consulting, custom development, integration and migration services.
    - question: How much does a custom CRM cost?
      answer: The main variables are business rules, integrations, migration, user interfaces and ongoing support. Scope a first release and compare proposals against the same acceptance criteria.
    - question: Who owns the code?
      answer: The Open Mercato core is MIT licensed. Confirm ownership and access for project-specific code, infrastructure, accounts and third-party components in the agreement with your delivery team.
    - question: Can AI build the whole application for us?
      answer: AI-assisted development can work within the framework's conventions. Production delivery still needs requirements, review, testing, migration validation and an accountable operating team.
cta:
  title: Bring three workflows worth building around.
  body: We can help you find a delivery partner and shape a first release with clear outcomes, integrations and acceptance criteria.
  primary:
    label: Scope your CRM project
    href: /contact?interest=custom-crm-development
  note: Talk through your process, integrations and implementation needs with the Open Mercato team.
