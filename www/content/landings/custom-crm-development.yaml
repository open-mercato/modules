pains:
  title: Scope the build and the team who will maintain it.
  items:
    - title: The estimate starts with platform plumbing
      body: Authentication, permissions, CRUD screens and common customer records take time to build. Reuse the Open Mercato foundation and make the business-specific scope visible in the estimate.
      art:
        src: /media/landings/6af5f54c44a15bad8e0b9549-om-lp-access-v3.svg
        alt: ""
        decorative: true
    - title: The prototype misses the difficult cases
      body: Permissions, data migration, integrations and exception handling determine whether the CRM works in production. Put representative transactions and acceptance tests into the pilot.
      art:
        src: /media/landings/6af5f54b1b98315466ed31c0-om-lp-migration-v3.svg
        alt: ""
        decorative: true
    - title: The original developer becomes the operating plan
      body: Buyers worry about maintenance and continuity. Agree source ownership, documentation, deployment access and support responsibilities as delivery milestones.
      art:
        src: /media/landings/6af5f54aacc44024cbb1c372-om-lp-connections-v3.svg
        alt: ""
        decorative: true
