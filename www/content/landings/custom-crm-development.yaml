comparison:
  title: Explore implementation and commercial details
  label: What matters
  columns:
    - Delivery question
    - Open Mercato
  rows:
    - topic: Customer model
      theirs: Which relationships and records are already covered?
      ours: Companies, people and deals provide a starting model to extend.
    - topic: Business rules
      theirs: What needs configuration and what needs development?
      ours: List required fields, workflows, screens and integrations explicitly.
    - topic: Migration
      theirs: How will history and relationships be validated?
      ours: Agree source mapping, sample imports and reconciliation criteria.
    - topic: Production readiness
      theirs: Who is responsible for hosting, access and recovery?
      ours: Assign those responsibilities and test the operating procedures.
    - topic: Handover
      theirs: Can another team maintain the system later?
      ours: Deliver source, documentation, deployment access and a support agreement.
