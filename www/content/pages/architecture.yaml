jsonLd:
  type: TechArticle
  faq:
    - question: What technologies does Open Mercato use?
      answer: "Open Mercato is built on a modern TypeScript stack: Next.js for the full-stack application layer, Node.js as the runtime, Tailwind CSS for styling, PostgreSQL as the primary database, and Redis for caching. The API layer uses OpenAPI and Swagger for documentation. The architecture follows a Modular Monolith pattern with Awilix for dependency injection and MikroORM for database interactions. This stack provides deployment simplicity with strict module boundaries, making it production-ready for enterprise teams from day one."
    - question: How extensible is the Open Mercato framework?
      answer: "Open Mercato is built around the Open-Closed Principle through its Overlay system. The core modules in src/modules remain untouched, while all custom logic, UI overrides, and new entities live in the src/apps directory. At build time, generators scan both directories - if a file exists in the Overlay, it replaces or extends the Core equivalent. This eliminates framework lock-in: you can update the core indefinitely without your custom changes breaking. The Awilix DI container also lets you swap any core service for a custom implementation by simply re-registering it."
    - question: How does Open Mercato handle security and data encryption?
      answer: Open Mercato implements enterprise-grade security at multiple layers. Field-Level Encryption (FLE) uses AES-GCM to encrypt sensitive data at rest, with configurable per-field encryption tagging. Each tenant has its own encryption context through Tenant-Scoped KMS, so encryption keys never cross tenant boundaries. Row-level scoping automatically pipes every database query through a global filter that injects tenantId and organizationId, preventing data leaks between customers. This architecture is designed to pass Level 3 security audits and is suitable for HIPAA, FinTech, and other compliance-heavy use cases.
    - question: How does Open Mercato support AI-assisted development?
      answer: Open Mercato is designed to be read by LLMs and AI coding agents. The context-rich monorepo keeps UI, API, and schema together in a single well-structured codebase, giving agents the full relationship context they need. Each module contains an AGENTS.md file - a machine-readable specification that acts as a guardrail for AI generation. The framework provides the hard parts (auth, multi-tenancy, RBAC, encrypted data layers) so AI agents can focus on business logic instead of infrastructure plumbing that is notoriously difficult to prompt correctly and securely.
