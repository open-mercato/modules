  # the comparison table: the first item is the header row (its points the two columns), then one row per item (title
  # the row, points the two cells); a cell `Desktop text | Phone text` reads differently on a phone
  - type: features
    layout: home-compare
    title: Skip the *commodity work*.
    lead: What it takes to ship a production-ready CRM/ERP feature.
    items:
      - points:
          - Build from scratch | From scratch
          - With Open Mercato | Open Mercato
      - title: Time to first feature | First feature
        points:
          - ~3-6 weeks
          - ~2 days
      - title: Security defaults | Security
        points:
          - Manual setup | Manual
          - Yes (OWASP) | Yes
      - title: AI agent compatibility | AI agents
        points:
          - Custom integration | Custom
          - Native
      - title: Modules pre-built | Modules
        points:
          - "0"
          - "{moduleCount}"

  # the two ways in: the developer's command (body) and the sandbox (cta)
  - type: features
    layout: home-sandbox
    items:
      - eyebrow: DEVELOPER?
        title: Start with one command.
        body: git clone https://github.com/open-mercato/open-mercato.git
      - eyebrow: NOT A DEVELOPER?
        title: Sandbox is like Lovable, but it makes apps you can really trust and scale
        cta:
          label: Build with sandbox
          href: https://app.openmercatocloud.com/signup?template=mercato

  # the case studies the live home page features, in its order
  - type: carousel
    layout: home-cases
    title: Case Studies
    primary:
      label: View all case studies
      href: /case-studies
    items:
      - title: "MDM NT: shipping automation alongside an existing ERP"
        body: A 500-person manufacturer connected packing, batch label generation and carrier tracking with Open Mercato, while its existing ERP kept running the business.
        image:
          src: /media/case-studies/6af1d75b999082f56d4ca85f-img-4335-min-1200x800.jpeg
          alt: "MDM NT: shipping automation alongside an existing ERP"
        cta:
          label: Read case study
          href: /case-studies/mdm-nt-shipping-automation
      - title: "Covo: one travel wallet, every balance accounted for"
        body: One balance for mobile data in 190+ countries sounds simple. Covo’s team built the ledger, eSIM lifecycle and operator workspace needed to keep that promise, on an Open Mercato foundation.
        image:
          src: /media/case-studies/6aa17c420e840d0134af8cf4-6aa17b707e24478aefae5d70-covo-esim-wallet-card.png
          alt: "Covo: one travel wallet, every balance accounted for"
        cta:
          label: Read case study
          href: /case-studies/covo-travel-esim-wallet
      - title: "TraceCore: from the production floor to connected MRP"
        body: Built by BGW Pharma from its own manufacturing experience, TraceCore connects recipes, materials, production and customer orders through LOT traceability, on Open Mercato.
        image:
          src: /media/case-studies/6af1fadaee6670759c32ef42-6af1fabbc8429cd84dd8099e-mrp-pharma-cover.jpeg
          alt: "TraceCore: from the production floor to connected MRP"
        cta:
          label: Read case study
          href: /case-studies/tracecore
      - title: "Senior Care Operations: from care plans to signed records"
        body: A care order is only the beginning. This hackathon demo connects clients, branch schedules, caregiver visits and signed service confirmations on a reusable Open Mercato foundation.
        image:
          src: /media/case-studies/6af1fc43e7a6d7ea0dd1dbf3-6af1fc3cef231e388b0abaa0-senior-care-wall-cover.jpeg
          alt: "Senior Care Operations: from care plans to signed records"
        cta:
          label: Read case study
          href: /case-studies/senior-care-operations

