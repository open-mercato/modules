webflowId: 69a97e33d587824eef365d5f
seo:
  title: Open Mercato - AI CRM/ERP Framework | Start with 80% Done
  description: AI-supportive CRM/ERP foundation framework. Modular, extensible, designed for teams that want strong defaults with room to customize everything.
  ogImage: /media/pages/69b16891c7299bff733f1851-og-image.jpg
jsonLd:
  type: WebPage
blocks:
  # the hero: `eyebrow` is the release badge (the browser shows the latest release of GitHub, as live), `label` the
  # line beside it, `primary` and `secondary` the first two buttons, `note` the third (one link); `items` the
  # assistants it works with, by name (the component draws their marks)
  - type: hero
    layout: home-hero
    eyebrow: v0.9.0
    label: Open source · MIT licensed
    title: Start with *80% done*
    lead: The open-source framework for building business apps. Create your CRM, warehouse system, or whole ERP with AI. Safer and faster than building from scratch.
    primary:
      label: Build in sandbox
      href: https://app.openmercatocloud.com/signup?template=mercato
    secondary:
      label: Clone repo
      href: https://github.com/open-mercato/open-mercato
    note: "[Academy](/learn-ai-engineering)"
    items:
      - title: Codex
      - title: Claude
      - title: Cursor
      - title: SSH

  # the builder: the first item is the assistant's window (eyebrow and title its header, body its greeting, points the
  # composer's placeholder and button, note what the phone shows once every request is in), then the seven requests
  # (title) and the assistant's answers (body), in the order the tower grows; `note` is the scene for screen readers
  - type: features
    layout: home-flex
    eyebrow: BUILD AROUND YOUR BUSINESS
    title: |-
      *The most flexible*
      business apps framework.
    lead: |-
      CRM, warehouse operations, AI agents, and automations.
      Connect the pieces. Make it yours.
    note: "Seven requests build a tower: CRM and warehouse supports, an automation bridge, procurement and commerce, then an AI workflows manager and your fancy idea on top."
    items:
      - eyebrow: Build with your AI assistant
        title: One request. One new capability.
        body: What should your app do next?
        points:
          - Describe what you want to build…
          - Plan your next module
        note: Your business app, connected
      - title: Add CRM
        body: CRM added. Your first module is ready.
      - title: Add a warehouse module
        body: Warehouse added. Inventory is connected.
      - title: Connect them with automations
        body: Automations added across both modules.
      - title: Add procurement
        body: Procurement added to your business app.
      - title: Add commerce
        body: Commerce added. Your system keeps growing.
      - title: Add an AI workflows manager
        body: AI workflows manager added. Your modules work together.
      - title: Add your fancy idea
        body: Your fancy idea, built into your business app.

  - type: features
    layout: home-80
    title: Start with *80% done*.
    lead: Build on the business logic, architecture and AI tooling our team has already engineered and tested. Put your effort into what makes your business different.
    items:
      - title: Business Logic
        body: Our team has already built and tested the rules behind customers, orders and pricing. You inherit that work, plus an evaluation harness that checks how AI agents extend the framework.
        image:
          src: /media/pages/home-80-business-logic.svg
          alt: "One CRM module in cross-section: code, business logic, tests and evaluations."
      - title: Security & Infrastructure
        body: Tenant isolation, encryption and audit trails are built into the foundation. Spend your time building product features instead of assembling security infrastructure from scratch.
        image:
          src: /media/pages/home-80-security.svg
          alt: A three-dimensional security shield with separate isolation, encryption and audit safeguards.
      - title: AI Software Factory
        body: Shared specs, architecture rules, agent skills and verification steps are the building blocks for your AI software factory. Give every developer and agent a repeatable path from brief to reviewed code.
        image:
          src: /media/pages/home-80-ai-software-factory.svg
          alt: One connected workflow with BUILD and EVALS in focus, while SPEC and REVIEW recede into the background.
      - title: Performance
        body: Caching, indexed queries and background events are part of a deliberate architecture. Start with the foundations for responsive business apps instead of retrofitting them later.
        image:
          src: /media/pages/home-80-performance.svg
          alt: Illustrative response-time chart with a cache-hit checkpoint, representing caching and query architecture without benchmark claims.
      - title: Auth & Access
        body: Roles and feature-level permissions decide who can see and change what, within the right tenant. Reuse one access model across your modules and AI tools.
        image:
          src: /media/pages/home-80-auth-access.svg
          alt: A sales user can read and edit customers and read orders, while billing, settings and user administration are denied.
      - title: Built-in MCP
        body: Connect AI agents to your business with a built-in MCP server and permission-aware tools. Skip building the protocol, tool registry and access checks yourself.
        image:
          src: /media/pages/home-80-built-in-mcp.svg
          alt: AI agent connects through the built-in MCP server to CRM in focus, with orders and catalog faded into the background.
      - title: Build Your Own ERP
        body: Compose customers, sales, catalog and warehouse modules into your own ERP. Adapt the data model and workflows to your operations, with full control of the code.
        image:
          src: /media/pages/home-80-build-your-own-erp.svg
          alt: Customers, sales and warehouse modules fit on your ERP foundation, with a dedicated place for your own module.

