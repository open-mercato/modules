    markdown: |-
      ## Privacy Policy

      Welcome to CT Tornado (the publisher of OpenMercato.com) Privacy Policy.

      Your privacy is very important to us. This document contains all informations on how we collect personal data, including information about how we store, use, transfer, and delete that data. It also explains how our website uses cookies. Our aim is to bring understanding and clarity on how personal data is processed at CT Tornado.

      ## Processing Personal Data

      ### The Controller

      The controller of your personal data is **Open Mercato sp. z o.o.**, with its registered office at **ul. Wyspa Słodowa 7, 50-266 Wrocław, Poland**, entered into the Register of Entrepreneurs of the National Court Register (KRS) maintained by the District Court for Wrocław-Fabryczna in Wrocław, 6th Commercial Division of the National Court Register, under **KRS No. 0001253104**, VAT No. (**NIP**) **PL8982336029**, REGON **545230330**, with a share capital of **PLN 5,000.00**, fully paid up.

      ### The Personal Data

      We collect and process your data ONLY on your request, on the legal basis of your consent in following fields:

      #### Contact form

      1. The contact form is a basic way of communication with our specialists. You can find it many different places at the site, but its construction is always the same. The contact form allows you to a sent inquiry about our product and services, costs estimates or product demos.
      2. For the purpose of answering your inquiry, we collect following data: name, e-mail address, phone number (optionally) and individual message (if you provide one). For a better understanding of the inquiry, we additionally ask to choose from the list following information: Subject and (optionally) free text message. This data is used to answer your inquiry, provide you our products and services, but also to marketing purposes e.g. inform you about our services and products.
      3. The data is collected and processed only upon your consent. Your personal data will be stored in our potential clients database for indefinite period of time.
      4. In the contact form, you can sign up for marketing materials like newsletter and publications.
      5. Your data will be processed until you inform us about your withdraw. You can withdraw your consent at any time by sending us a message to [info@openmercato.com](mailto:info@openmercato.com) After that, all your data will be erased from our database.

      #### Publications & Newsletter

      1. We share our eCommerce knowledge and experience in marketing materials like: publications (reports, ebooks, guides and checklists), blog posts and news. You can find them in specific sections on our website ([https://openmercato.com](https://openmercato.com/)), dedicated sites and our blog. You can download them, free of charge, at the time that suits you best.
      2. By downloading the publication you are granted a permission to temporarily download one copy of the materials for personal, non-commercial transitory viewing only.
      3. This is the grant of a license, not a transfer of title, and under this license you may not: modify or copy the materials; use the materials for any commercial purpose, or for any public display (commercial or non-commercial); attempt to decompile or reverse engineer any software contained on openmercato.com's web site; remove any copyright or other proprietary notations from the materials; or transfer the materials to another person or "mirror" the materials on any other server. This license shall automatically terminate if you violate any of these restrictions and may be terminated by CT Tornado at any time. Upon terminating your viewing of these materials or upon the termination of this license, you must destroy any downloaded materials in your possession whether in electronic or printed format.
      4. Our newsletter is a special selection of our freshest blog posts, publications, case studies, events, products and services, as well as the eCommerce trends and news dedicated to eCommerce technology and software development.
      5. The newsletter is designed to share knowledge with eCommerce specialists (business owners, managers, marketers, CTOs, and engineers).
      6. Signing up for the newsletter is voluntary and can be done at openmercato.com. The newsletter is sent to your email periodically (usually once a month) and on special occasions (like publication premiere).
      7. For the purpose of sharing our marketing materials, we collect following data: name, e-mail address. This data helps us to understand better our audience.
      8. The data is collected and processed only upon your consent. Your personal data will be stored in our database for the indefinite period of time.
      9. Your data will be processed until you inform us about your withdraw. You can withdraw your consent at any time by sending us a message to [info@openmercato.com](mailto:info@openmercato.com) or by an unsubscribing link in the email. After that, all your data will be erased from our database.

      ## Performance of Your Rights

      We collect and process your personal data only with your consent. Your personal data will be stored in our database for the indefinite period of time (unless you agreed differently). At all this time you have the right to request from us:

      1. access to your personal data;
      2. correction of your personal data;
      3. erasure of your personal data;
      4. restriction of processing;
      5. data portability.

      To perform any of your rights please email us at [info@openmercato.com](mailto:info@openmercato.com)

      Your request will be resolved in a timely and effective manner. We might contact you to arrange details of your request.

      Withdrawal of your personal data will not affect the lawfulness of processing based on consent before its withdrawal.

      The complaint can be also lodged to a competent supervisory authority. For Poland the supervisory authority is The Bureau of the Inspector General for the Protection of Personal Data in Poland (https://www.giodo.gov.pl/).

      ## Protection of Personal Data

      ### Data Storage and Technical Solutions

      To ensure protection of your personal data we adopt appropriate data collection, storage and processing practices and security measures, including encryption.

      We use third-party vendors and hosting partners, for hardware, software, networking, storage, and related technology we need to run our websites. Your personal data is stored in secured networks accessible by a limited number of persons who have special access rights to these systems.

      ### Third-Party Software

      We occasionally work with third parties who support us with services: Google Analytics tracking technologies, HubSpot, Mailchimp and WebFlow communication tools. Those third parties might need to access to specific information to carry out their work for us. We rigorously vet these third-party vendors to ensure they meet our privacy standards and limit the data they can access to only what is necessary for them to perform their contracted tasks.

      ### Third-Party Embeds

      In our content, you can firm third-party embeds: Twitter tweets, YouTube videos, SlideShare presentations or social sharing features. These files send data to the hosted site just as if you were visiting that site directly. We don't control what data third parties collect in cases like this, or what they will do with it. These third-party embeds are covered by the privacy policy of the third-party service.

      ## Cookies and Pixel Tags

      We use various tracking methods, such as cookies, pixel tags and other technologies to receive information which may include personal data from your browser (like IP-address, unique cookie identifier; unique device identifier and device type; domain, browser type and language, operating system and system settings; country and time zone; previously visited websites; information about your interaction with our website; and access times and referring URLs).

      We use cookies and pixel tags to track your usage of the website and to understand your preferences; to determine whether an email has been opened and acted upon; and to present you with advertising relevant to your interests.

      We also may receive reports based on the use of these technologies by our service/analytics providers (like Google Analytics). We use those reports to obtain statistics about traffic and site interaction, so that we can improve our website and your experience.

      We do not link the information we store in cookies to any personal data you submit on our site.

      Third parties may also collect information via our website through cookies, third party plug-ins and widgets. These third parties collect data directly from your web browser and the processing of this data is subject to their own privacy policies.

      Some of the cookies will only be used if you use certain features or select certain preferences, and some cookies are essential to the website and will always be used.

      ### How and why do we use them?

      1. For the purpose of site usage (strictly necessary).

      These cookies, pixel tags and other technologies are essential in order to enable the website to provide the feature you have requested.

      Cookies: _cfuid; PHPSESSID.

      2. For the purpose of functionality.

      These cookies, pixel tags and other technologies remember your usage of our website. We use these cookies to provide you with an experience more appropriate and to make your use of the Services more tailored.

      Cookies: _livechat; _livechat_lastvisit; lc_window_state; lc_ssoundefined; _lc_vv; main_window_timestamp; recent_window; message_text; hubspotutk.

      3. For the purpose of analytics.

      These cookies, pixel tags and other technologies collect information about way how you interact with our website. We use Google Analytics, Hubspot and Hotjar cookies to understand how you arrive at and browse our products and website to identify areas for improvement such as navigation, user experience, and marketing campaigns.

      Cookies: _ga; dc_gtm_UA-#; _gid; _vis_opt_s; _vis_opt_test_cookie; _vwo_uuid; _vwo_uuid_v2; _vwo_ds; vwo_sn; e.gif, v.gif; __hssc; __hssrc; __hstc; __ptq.gif; _hjIncludeInSample; collect.

      4. For the purpose of advertising and retargeting.

      These cookies, pixel tags and other technologies collect information about your browsing habits in order to make advertising relevant to you and your interests. They remember the websites you have visited and that information is shared with other parties such as advertising technology service providers and advertisers. We use Facebook Pixel, Google Ads and [NextRoll](https://www.nextroll.com/privacy) cookies.

      Cookies: fr; tr; NID; ads/ga-audiences; nQ_cookieId; nQ_visitId; __adroll_fpc

      5. For the purpose of social media sharing.

      These cookies, pixel tags and other technologies are used when you share information using a social media sharing button. The social network will record that you have done this. This information may be linked to targeting/advertising activities.

      Cookies:

      - LinkedIn: leo_auth_token; JSESSIONID; _lidc; _bcookie; _bscookie; _visit; _lang; IN_HASH
      - SlideShare: _language; SERVERID; __utma; __utmb; __utmc; __utmz; __utmt; _uv_id; RT
      - Twitter: _twitter_sess; personalization_id; guest_id; external_referer; ct0;
      - Google+: SIDCC, GAPS

      ### How to manage cookies?

      You can deactivate cookies through a functionality built into your web browser. Browser manufacturers provide help pages relating to cookie management in their products. Please see below to learn more about how to control cookie settings through your browser:

      [Google Chrome](https://support.google.com/chrome/answer/95647);

      [Mozilla Firefox](https://support.mozilla.org/en-US/kb/enable-and-disable-cookies-website-preferences);

      [Microsoft Edge](https://privacy.microsoft.com/en-us/windows-10-microsoft-edge-and-privacy);

      [Microsoft Internet Explorer](https://support.microsoft.com/pl-pl/help/17442/windows-internet-explorer-delete-manage-cookies);

      [Safari](https://support.apple.com/guide/safari/manage-cookies-sfri11471/mac).

      Certain third-party advertising networks permit users to opt out of or customize preferences associated with your Internet browsing. [Click here](https://myadcenter.google.com/) to customize Google cookies preferences. You can opt out of interest-based targeting provided by participating ad servers through the [Digital Advertising Alliance](https://youradchoices.com/).

      If you do not accept cookies you may not be able to use all aspects of our website. You will not be able to opt-out of any cookies or other technologies that are "strictly necessary" for the Services.

      ### Changes of Privacy Policy

      We may periodically update our Privacy Policy. We will inform you about most significant changes, but some changes will be made without a notice. By using openmercato.com you agree to be bound by the current version of our Privacy Policy published at https://www.openmercato.com/privacy-policy. We encourage you to review this Privacy Policy periodically.

      ### Governing Law

      Any claim relating to our Privacy Policy shall be governed by the laws of the State of Poland without regard to its conflict of law provisions.

      ### Questions & Contact

      Contact us with any and all issues regarding processing of personal data or use of cookies / pixel tags.

      We also welcome your feedback about our Privacy Policy

      Contact us at: [info@openmercato.com](mailto:info@openmercato.com)

      ## Data Protection Officer:

      ### contact us at [info@openmercato.com](mailto:info@openmercato.com)
