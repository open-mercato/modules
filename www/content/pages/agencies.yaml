blocks:
  - type: hero
    layout: about-header
    eyebrow: For Agencies & Software Houses
    title: Stop selling hours. Start shipping products.
    lead: Clients want fast, working software they own. Open Mercato enables fixed-price projects on a reusable foundation with sensible margins.
    primary:
      label: Clone the Repo
      href: https://github.com/open-mercato/open-mercato
    secondary:
      label: See Live Demo
      href: https://openmercatocloud.com/demo
  - type: features
    layout: agencies-math
    eyebrow: the math
    title: Same client project. Completely different economics.
    items:
      - body: A typical CRM/portal project for a mid-market client. Here's what changes when you stop building from scratch.
        points:
          - Auth, RBAC, multi-tenancy
          - CRM core + entities
          - Design system + UI
          - Search, events, caching
          - Client-specific features
          - Testing & security audit
        note: Total devliery
      - title: Without Mercato
        points:
          - 3 weeks
          - 4 weeks
          - 2 weeks
          - 2 weeks
          - 4 weeks
          - 2 weeks
        note: 17 weeks
      - title: With Mercato
        points:
          - ✓ Included
          - ✓ Included
          - ✓ Included
          - ✓ Included
          - 3 weeks
          - 1 week
        note: 4 weeks
  - type: cta
    layout: agencies-margin
    title: 3× the margin.
    body: Same scope. Same price to the client. 4 weeks instead of 17.
    primary:
      label: See Live Demo
      href: https://openmercatocloud.com/demo
  - type: features
    layout: partners-why
    eyebrow: Your workflow
    title: |-
      Clone → Overlay →
      → Ship → Repeat.
    items:
      - eyebrow: "01"
        title: Clone the base
        icon:
          src: /media/pages/agencies-clone-the-base.svg
          alt: ""
          decorative: true
        body: Fork Open Mercato for the new client. Auth, CRM, design system - running in 5 minutes.
        note: Day 1
      - eyebrow: "02"
        title: Overlay their workflow
        icon:
          src: /media/pages/agencies-overlay-their-workflow.svg
          alt: ""
          decorative: true
        body: Your team (or AI agents) drops files in src/apps/. Core never modified. Clean separation.
        note: Week 1-3
      - eyebrow: "03"
        title: Ship & handoff
        icon:
          src: /media/pages/agencies-ship-handoff.svg
          alt: ""
          decorative: true
        body: Client gets a fully-owned codebase on their infra. No vendor lock-in. No recurring platform fees.
        note: Week 4
      - eyebrow: "04"
        title: Maintain & upsell
        icon:
          src: /media/pages/agencies-maintain-upsell.svg
          alt: ""
          decorative: true
        body: Sell ongoing feature development. Each overlay is scoped - easy to estimate, profitable to deliver.
        note: Ongoing
  - type: features
    layout: agencies-team
    eyebrow: What your team gets
    title: Mid-level devs ship senior-quality output.
    body: The architecture and AI guardrails do the heavy lifting. Your team learns real skills - not workarounds.
    items:
      - title: Architecture that enforces quality
        icon:
          src: /media/pages/agencies-architecture-that-enforces-quality.svg
          alt: ""
          decorative: true
        body: OCP overlays mean your devs can't accidentally break core modules. The structure prevents the mistakes before code review catches them.
      - title: AI agents that follow the rules
        icon:
          src: /media/pages/agencies-ai-agents-that-follow-the-rules.svg
          alt: ""
          decorative: true
        body: AGENTS.md and .ai/specs/ ship with the repo. Claude, Cursor, Copilot - they all generate code that fits the architecture, not fights it.
      - title: Real AI engineering skills
        icon:
          src: /media/pages/agencies-real-ai-engineering-skills.svg
          alt: ""
          decorative: true
        body: Your team learns spec-driven development and context-first workflows. Skills compound across projects.
      - title: Enterprise security out of the box
        icon:
          src: /media/pages/agencies-enterprise-security-out-of-the-box.svg
          alt: ""
          decorative: true
        body: Field-level encryption, RBAC, audit trails, GDPR. Stop spending 3 weeks on auth for every client. Pass security reviews on day one.
      - title: Reusable across clients
        icon:
          src: /media/pages/agencies-reusable-across-clients.svg
          alt: ""
          decorative: true
        body: Build a logistics overlay once. Use it for 5 clients with minor customization. Your IP compounds. Your margins grow.
      - title: No vendor lock-in (for you or them)
        icon:
          src: /media/pages/agencies-no-vendor-lock-in-for-you-or-them.svg
          alt: ""
          decorative: true
        body: MIT licensed. Client gets full source. You're not reselling someone else's SaaS - you're delivering owned software on open infrastructure.
