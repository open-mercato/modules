<section class="om-workbench" data-om-guide="cpq" aria-label="What is CPQ? Configure a machine and see its quote">
  <style>
    .om-workbench {
      --ink: #18212b;
      --muted: #495762;
      --rule: #c8ced0;
      --paper: #f8f8f4;
      --blue: #2446ab;
      box-sizing: border-box;
      max-width: 100%;
      margin: 1.5rem 0 2.25rem;
      padding: clamp(16px, 3vw, 30px);
      border: 1px solid var(--rule);
      border-top: 3px solid var(--blue);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font:
        400 16px/1.45 system-ui,
        sans-serif;
      text-align: left;
    }
    .om-workbench *,
    .om-workbench *:before,
    .om-workbench *:after {
      box-sizing: border-box;
    }
    .om-workbench .wb-title {
      font:
        650 clamp(21px, 3vw, 28px)/1.2 system-ui,
        sans-serif;
      color: var(--ink);
      margin: 0 0 18px;
      letter-spacing: -0.035em;
    }
    .om-workbench .wb-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 20px;
      margin: 12px 0;
    }
    .om-workbench label,
    .om-workbench legend {
      display: block;
      color: var(--ink);
      font:
        600 14px/1.35 system-ui,
        sans-serif;
    }
    .om-workbench input:not([type='checkbox']),
    .om-workbench select,
    .om-workbench textarea {
      display: block;
      width: 100%;
      min-width: 0;
      margin: 6px 0 0;
      padding: 9px 10px;
      border: 1px solid #869295;
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      font:
        400 16px/1.35 system-ui,
        sans-serif;
    }
    .om-workbench input[type='checkbox'] {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      accent-color: var(--blue);
    }
    .om-workbench textarea {
      min-height: 100px;
      font-family: ui-monospace, monospace;
    }
    .om-workbench input:focus-visible,
    .om-workbench select:focus-visible,
    .om-workbench textarea:focus-visible,
    .om-workbench button:focus-visible,
    .om-workbench a:focus-visible {
      outline: 3px solid #4262b8;
      outline-offset: 2px;
    }
    .om-workbench button,
    .om-workbench a.wb-button {
      font:
        600 14px/1.3 system-ui,
        sans-serif;
      color: #fff;
      background: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 10px 15px;
      cursor: pointer;
      text-decoration: none;
      margin: 0;
    }
    .om-workbench button.secondary {
      background: white;
      color: var(--ink);
      border-color: #879394;
    }
    .om-workbench button:disabled {
      opacity: 0.48;
      cursor: default;
    }
    .om-workbench .wb-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 0;
    }
    .om-workbench .wb-results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(125px, 100%), 1fr));
      gap: 14px;
      border-block-start: 1px solid var(--rule);
      margin-top: 20px;
      padding-top: 16px;
    }
    .om-workbench .wb-results small {
      display: block;
      color: var(--muted);
      font:
        500 13px/1.3 system-ui,
        sans-serif;
    }
    .om-workbench .wb-results strong {
      display: block;
      font:
        650 clamp(19px, 3vw, 27px)/1.3 ui-monospace,
        monospace;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }
    .om-workbench .wb-hint,
    .om-workbench .wb-status,
    .om-workbench .wb-error {
      margin: 10px 0 0;
      font:
        400 14px/1.5 system-ui,
        sans-serif;
      text-align: left;
      color: var(--muted);
    }
    .om-workbench .wb-error:not(:empty) {
      color: #992d18;
      font-weight: 600;
    }
    .om-workbench .wb-error:empty,
    .om-workbench [hidden] {
      display: none !important;
    }
    .om-workbench .wb-sheet,
    .om-workbench .wb-snapshot {
      margin-top: 14px;
      padding: 16px;
      background: white;
      border: 1px solid var(--rule);
      border-radius: 4px;
      overflow-wrap: anywhere;
    }
    .om-workbench .wb-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(95px, 100%), 1fr));
      gap: 8px;
      padding: 12px 0;
      border-top: 1px solid var(--rule);
      align-items: end;
    }
    .om-workbench .wb-row label:first-child {
      grid-column: span 2;
    }
    .om-workbench .wb-row label {
      font-size: 12px;
    }
    .om-workbench .wb-row input {
      padding: 7px;
    }
    .om-workbench .wb-row button {
      justify-self: start;
      padding: 8px 10px;
    }
    .om-workbench .wb-codes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(235px, 100%), 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .om-workbench .wb-code {
      min-width: 0;
      padding: 12px;
      background: white;
      border: 1px solid var(--rule);
      border-radius: 4px;
      text-align: center;
    }
    .om-workbench .wb-code svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto 8px;
    }
    .om-workbench .wb-code button {
      padding: 6px 10px;
    }
    .om-workbench .wb-choice {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }
    #om-sheet-print {
      display: none;
    }
    @media (max-width: 560px) {
      .om-workbench .wb-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .om-workbench .wb-grid {
        gap: 12px;
      }
      .om-workbench .wb-title {
        margin-bottom: 14px;
      }
    }
    @media (max-width: 400px) {
      .om-workbench .wb-grid {
        grid-template-columns: 1fr;
      }
    }
    @media print {
      body.om-printing {
        overflow: visible !important;
        height: auto !important;
        background: white !important;
      }
      body.om-printing > :not(#om-sheet-print) {
        display: none !important;
      }
      body.om-printing > #om-sheet-print {
        display: block !important;
        position: static !important;
        color: #111;
        font:
          12pt/1.4 Arial,
          sans-serif;
        background: white;
        max-width: none;
        margin: 0;
        padding: 0;
      }
      #om-sheet-print * {
        box-sizing: border-box;
      }
      #om-sheet-print h1 {
        font:
          600 22pt/1.2 Arial,
          sans-serif;
        color: #111;
        margin: 0 0 6mm;
      }
      #om-sheet-print table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5mm;
      }
      #om-sheet-print th,
      #om-sheet-print td {
        border-bottom: 1px solid #777;
        text-align: left;
        padding: 2mm;
        overflow-wrap: anywhere;
      }
      #om-sheet-print .wb-labels {
        display: flex;
        gap: 1.5mm;
        flex-wrap: wrap;
      }
      #om-sheet-print .wb-print-label {
        display: flex;
        align-items: center;
        justify-content: center;
        break-inside: avoid;
        border: 0.2mm dotted #aaa;
        page-break-inside: avoid;
      }
      #om-sheet-print svg {
        display: block;
        max-width: none !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
  <div class="wb-title">Configure a sample machine</div>
  <p class="wb-hint">Illustrative prices in USD. This teaching example uses two rules from the Arvo demo.</p>
  <div class="wb-grid">
    <label
      >Attachment<select data-ui="attachment">
        <option value="standard">Standard · included</option>
        <option value="medium">Mid-size · +$2,000</option>
        <option value="large">Largest · +$3,500</option>
      </select></label
    >
    <label
      >Finish<select data-ui="finish">
        <option value="standard">Standard · included</option>
        <option value="custom">Custom color · +$600</option>
      </select></label
    >
  </div>
  <label class="wb-choice"
    ><input data-ui="detect" type="checkbox" /> Person detection (+$900) with required rear camera (+$300)</label
  >
  <div class="wb-results" aria-live="polite">
    <div><small>Configured price</small><strong data-ui="price">$40,000.00</strong></div>
  </div>
  <p class="wb-status" data-ui="decision" role="status">Standard attachment. Ready to quote.</p>
  <div class="wb-actions"><button type="button" data-ui="save">Save example quote</button></div>
  <div data-ui="quote" class="wb-snapshot" aria-live="polite" hidden></div>
  <noscript><p>Enable JavaScript to edit the example in your browser.</p></noscript>
  <script>
    ;(() => {
      const root = document.currentScript.closest('[data-om-guide]')
      const get = (role) => root.querySelector('[data-ui="' + role + '"]')
      const all = (role) => Array.from(root.querySelectorAll('[data-ui="' + role + '"]'))
      const amount = (role) => {
        const input = get(role)
        return input.value.trim() && input.validity.valid ? input.valueAsNumber : NaN
      }
      const usd = (value) =>
        new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(value)
      const fmt = (value) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(value)
      const make = (tag, value) => {
        const element = document.createElement(tag)
        if (value !== undefined) element.textContent = value
        return element
      }
      function download(name, type, data) {
        const link = document.createElement('a')
        const url = URL.createObjectURL(new Blob([data], { type }))
        link.href = url
        link.download = name
        document.body.append(link)
        link.click()
        link.remove()
        setTimeout(() => URL.revokeObjectURL(url), 30000)
      }
      function printSheet(content) {
        document.getElementById('om-sheet-print')?.remove()
        const sheet = make('section')
        sheet.id = 'om-sheet-print'
        sheet.append(content)
        document.body.append(sheet)
        document.body.classList.add('om-printing')
        const finish = () => {
          document.body.classList.remove('om-printing')
          sheet.remove()
        }
        window.addEventListener('afterprint', finish, { once: true })
        window.print()
      }

      const attachments = {
        standard: ['Standard attachment', 0],
        medium: ['Mid-size attachment', 2000],
        large: ['Largest attachment', 3500],
      }
      function configuration() {
        const parts = [['Base machine', 40000], attachments[get('attachment').value]]
        if (get('finish').value === 'custom') parts.push(['Custom color', 600])
        if (get('detect').checked) parts.push(['Person detection', 900], ['Required rear camera', 300])
        return {
          parts,
          price: parts.reduce((sum, part) => sum + part[1], 0),
          review: get('attachment').value === 'large',
        }
      }
      function priceMachine() {
        const x = configuration()
        get('price').textContent = usd(x.price)
        get('decision').textContent =
          (x.review
            ? 'Manufacturer review required for the largest attachment. Choose a smaller attachment to save this demo quote.'
            : 'Configuration ready to quote.') + (get('detect').checked ? ' Rear camera included.' : '')
        get('save').disabled = x.review
      }
      root.addEventListener('change', priceMachine)
      get('save').addEventListener('click', () => {
        const x = configuration()
        if (x.review) return
        const list = make('ul')
        x.parts.forEach(([part, cost]) => list.append(make('li', part + ' · ' + usd(cost))))
        get('quote').replaceChildren(
          make('strong', 'Saved quote · ' + usd(x.price)),
          list,
          make('div', 'This copy stays fixed until you save another quote.'),
        )
        get('quote').hidden = false
      })
      priceMachine()
    })()
  </script>
</section>
