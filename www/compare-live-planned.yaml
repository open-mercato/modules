- url: /blog
  field: text
  note: "Live's category filter also offers Security, a category with no published post (here only categories with a post), lists the categories in another order, and has Webflow's form messages and the filter's empty-state text in its markup; live lists the post of 12 Apr 2026 (Open-source ERP in 2026) last, here it is in date order. Every published post is listed and linked, in the live markup."
