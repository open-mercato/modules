# Intended differences for `yarn om compare-live --planned` (www site migration spec, cutover step C6; RUNBOOK,
# "Main site switch"): one entry per URL and field the main site differs from the live Webflow site on purpose, with
# the reason. Owner's decision of 25 Nov 2026: until the designer's pass the main site mirrors the live templates
# (markup, Webflow classes, breadcrumb, sidebar CTA, table of contents, carousels), so a template part differs only
# where a note says why. Body text and content images were compared block by block (Webflow rich text against the
# preview's): the same, apart from what a note names.
# Landings and unique pages (Phases 5 and 6) are not listed: they fail until they are migrated.
- url: /blog
  field: description
  note: "Webflow has no description here; one of the 4 new descriptions of the spec (SEO table), final text with the unique pages (Phase 6)."
- url: /blog
  field: text
  note: "Live's category filter also offers Security, a category with no published post (here only categories with a post), lists the categories in another order, and has Webflow's form messages and the filter's empty-state text in its markup; live lists the post of 12 Apr 2026 (Open-source ERP in 2026) last, here it is in date order. Every published post is listed and linked, in the live markup."
- url: /blog
  field: json-ld
  note: "No JSON-LD on the list pages yet: Organization and WebSite site-wide come in Phase 7 (spec, SEO table). Not a template difference."
- url: /case-studies
  field: text
  note: "Live's page has no <main>, so its main text takes in the closing call to action that follows <main> here, and it has Webflow's form messages and the filter's empty-state text in its markup. The header, the filter and every card are the same."
